let BULK_INPUT = null;
function bulkPick() {
  if (!navigator.onLine) return toast('Uploading receipts needs signal. Try again when you have it.', true);
  if (!BULK_INPUT) {
    BULK_INPUT = el('input'); BULK_INPUT.type = 'file'; BULK_INPUT.accept = 'image/*'; BULK_INPUT.multiple = true;
    BULK_INPUT.className = 'hide'; BULK_INPUT.id = 'bulkFiles'; document.body.appendChild(BULK_INPUT);
    BULK_INPUT.onchange = () => { const fs = Array.from(BULK_INPUT.files || []); BULK_INPUT.value = ''; if (fs.length) bulkUpload(fs); };
  }
  BULK_INPUT.click();
}
async function bulkUpload(files) {
  const business = BIZ, results = [];
  const b = el('div');
  b.innerHTML = `<div class="scanstat busy" id="bkst">Starting…</div><div id="bkl"></div>`;
  openSheet('Uploading ' + files.length + ' receipt' + (files.length > 1 ? 's' : '') + ' · ' + BIZ_NAMES[business], b);
  $('#scrim').onclick = () => {};                       // keep it open until done
  for (let i = 0; i < files.length; i++) {
    $('#bkst').textContent = 'Reading ' + (i + 1) + ' of ' + files.length + '…';
    let line;
    try {
      const hash = await fileHash(files[i]);
      const img = await shrinkImage(files[i], 1800, 0.8);
      const r = await call('scanReceipt', { business, image: { data: img.data, type: img.type }, hash, createDraft: true, skipIfSamePhoto: true, id: uid() });
      if (r.skipped) line = `<b>Skipped</b> — already uploaded (${esc(r.duplicates[0].vendor || 'receipt')} ${money(r.duplicates[0].amount)}, ${esc(fmtDate(r.duplicates[0].date))})`;
      else {
        if (!biz().expenses) biz().expenses = [];
        upsertLocal(biz().expenses, r.expense); RECEIPTS[r.expense.id] = img.preview;
        line = `${esc(r.vendor || 'Unknown vendor')} · ${r.total ? money(r.total) : 'no total found'}` +
          (r.duplicates.length ? ` · <span class="pill bad">Possible duplicate</span>` : '');
      }
    } catch (e) { line = '<span class="dangertext">Couldn’t upload: ' + esc(e.message) + '</span>'; }
    results.push(line);
    $('#bkl').innerHTML = results.map((l, k) => `<div class="line row"><span class="grow">${k + 1}. ${l}</span></div>`).join('');
  }
  saveLocal();
  const st = $('#bkst'); st.classList.remove('busy');
  st.textContent = 'Done. They’re saved to Drive and waiting in “To review”.';
  const ok = btn('Review them', () => { closeSheet(); goTab('expenses'); }); ok.classList.add('wide'); ok.style.marginTop = '10px';
  b.appendChild(ok);
  $('#scrim').onclick = closeSheet;
}

/* ---- one expense: add, review, edit ---- */
function expenseSheet(x, presetJob, opts) {
  opts = opts || {};
  const isNew = !x;
  x = x ? clone(x) : { id: uid(), business: BIZ, status: 'Booked', date: today(), vendor: '', account: '', amount: 0, method: 'Card', job: presetJob || '', note: '', receipt: false,
                       bank: opts.bank || '', paidBy: opts.bank ? '' : acting().name, checkNo: '' };
  if (x.bank === undefined) x.bank = '';
  const reviewing = x.status === 'Review';
  let pending = null, removeReceipt = false, scanned = null, preview = null, status = '', busy = false, hash = '', notDup = false, serverDups = [];
  let autoTried = false, loadingRc = false;
  const touched = {};
  const vendors = [...new Set(expenses().map(e => e.vendor).filter(Boolean))].slice(0, 80);
  const jobs = jobOptions();
  if (x.job && !jobs.find(j => j.id === x.job) && docById(x.job)) jobs.unshift(docById(x.job));
  const acctOpts = sel => ['cogs', 'expense'].map(t => `<optgroup label="${t === 'cogs' ? 'Job costs (cost of goods sold)' : 'Overhead (operating expenses)'}">` +
    accounts().filter(a => a.type === t).map(a => `<option value="${esc(a.name)}" ${a.name === sel ? 'selected' : ''}>${esc(a.code + ' · ' + a.name)}</option>`).join('') + '</optgroup>').join('');
  const b = el('div');
  const rcHtml = `<label>Receipt</label><div class="receipt${reviewing ? ' big' : ''}" id="xrc"></div>
     <input id="xfile" type="file" accept="image/*" class="hide">`;
  b.innerHTML = (reviewing ? rcHtml : '') +
    `<div id="xdup"></div>` +
    `<div class="grid2">` + field('Amount $', `<input id="xam" class="money" type="number" inputmode="decimal" step="0.01" value="${x.amount || ''}" placeholder="0.00">`) +
    field('Date', `<input id="xdt" type="date" value="${esc(x.date)}">`) + `</div>` +
    field('Vendor', `<input id="xvn" list="xvl" value="${esc(x.vendor)}" placeholder="Home Depot, Shell…" autocomplete="off"><datalist id="xvl">${vendors.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`) +
    field('Book to account', `<select id="xac"><option value="">Pick an account…</option>${acctOpts(x.account)}</select><div class="hint" id="xah"></div>`) +
    field('Project (for job costing)', `<select id="xjb"><option value="">No project — general overhead</option>${jobs.map(j => `<option value="${esc(j.id)}" ${j.id === x.job ? 'selected' : ''}>${esc(jobLabel(j.id) + ' — ' + custName(j.customer))}</option>`).join('')}</select>`) +
    `<div class="grid2">` + field('Paid with', `<select id="xmt">${PAY_METHODS.map(m => `<option ${m === x.method ? 'selected' : ''}>${m}</option>`).join('')}</select>`) +
    field('Note', `<input id="xnt" value="${esc(x.note)}" placeholder="What it was for">`) + `</div>` +
    `<div class="grid2">` + field('Paid from', `<select id="xbk">${bankOptions(x.bank, 'Own money (out of pocket)')}</select>`) +
    `<div id="xpbw">` + field('Whose money', `<input id="xpb" list="xpl" value="${esc(x.paidBy || '')}" placeholder="Ricardo Uribe"><datalist id="xpl">${peopleNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>`) + `</div>` +
    `<div id="xckw">` + field('Check #', `<input id="xck" inputmode="numeric" value="${esc(x.checkNo || '')}">`) + `</div></div>` +
    (reviewing ? '' : rcHtml);
  const acts = el('div', 'actions');
  const nextDraft = () => expenses().filter(e => e.status === 'Review' && e.id !== x.id).sort((a, c) => (c.created || '').localeCompare(a.created || ''))[0];
  const more = reviewing && nextDraft();
  if (more) acts.appendChild(btn('Book & review next →', () => save(true)));
  acts.appendChild(btn(reviewing ? 'Book expense' : (isNew ? 'Save expense' : 'Save'), () => save(false), more ? 'ghost' : ''));
  if (more) acts.appendChild(btn('Skip — review the next one', () => { closeSheet(); setTimeout(() => expenseSheet(nextDraft()), 250); }, 'ghost'));
  function save(next) {
    if (busy) return toast('Still reading the receipt — one sec.', true);
    x.amount = r2($('#xam').value);
    if (!x.amount) return toast('Enter the amount. Use a minus for a return or refund.', true);
    x.account = $('#xac').value;
    if (!x.account) return toast('Pick the account to book it to.', true);
    x.date = $('#xdt').value || today(); x.vendor = $('#xvn').value.trim();
    x.method = $('#xmt').value; x.job = $('#xjb').value; x.note = $('#xnt').value.trim();
    x.bank = $('#xbk').value; x.paidBy = x.bank ? '' : $('#xpb').value.trim(); x.checkNo = x.method === 'Check' ? $('#xck').value.trim().replace(/^#/, '') : (x.checkNo || '');
    x.status = 'Booked';
    if (pending || scanned) { x.receipt = true; x.file = true; RECEIPTS[x.id] = preview; removeReceipt = false; }
    if (removeReceipt) { x.receipt = false; delete RECEIPTS[x.id]; }
    const dupsNow = notDup ? [] : localDuplicates(x, hash);
    x.dupOf = dupsNow.length ? dupsNow[0].e.id : '';
    if (hash) x.hash = hash;
    if (!biz().expenses) biz().expenses = [];
    upsertLocal(biz().expenses, Object.assign({ created: new Date().toISOString() }, x)); saveLocal();
    const payload = Object.assign({}, x); ['receipt', 'dupOf', 'link', 'file', 'checkFile', 'checkLink', 'created', 'createdBy', 'scanned'].forEach(k => delete payload[k]);
    if (scanned) { payload.receiptFile = scanned.fileId; payload.scanText = scanned.text; }
    else if (pending) payload.receipt = { data: pending.data, type: pending.type };
    if (removeReceipt) payload.removeReceipt = true;
    if (notDup) payload.notDuplicate = true;
    enqueue('saveExpense', payload, 'Expense ' + money(x.amount));
    closeSheet(); toast(reviewing ? 'Booked to ' + acctOf(x.account).name : 'Expense saved'); render();
    if (next) { const nx = nextDraft(); if (nx) setTimeout(() => expenseSheet(nx), 280); }
  }
  if (!isNew) acts.appendChild(btn(reviewing ? 'Delete — not a business expense' : 'Delete expense', () => confirmSheet('Delete this expense?', (x.amount ? money(x.amount) : 'This receipt') + (x.vendor ? ' at ' + x.vendor : '') + '. The photo stays in Drive.', 'Delete', () => {
    biz().expenses = expensesAll().filter(e => e.id !== x.id); saveLocal();
    enqueue('deleteExpense', { id: x.id }, 'Expense'); render();
  }, true), 'ghost dangertext'));
  b.appendChild(acts);
  openSheet(reviewing ? 'Review receipt · ' + BIZ_NAMES[x.business || BIZ] : isNew ? 'New expense · ' + BIZ_NAMES[x.business || BIZ] : 'Expense', b);

  // account suggestion from the vendor's history
  const hint = $('#xah');
  function suggest() {
    if (touched.xac) { hint.textContent = ''; return; }
    const sug = suggestAccount($('#xvn').value);
    if (sug && $('#xac').value !== sug) {
      if (!$('#xac').value) { $('#xac').value = sug; hint.textContent = 'Booked here last time for this vendor.'; }
      else hint.innerHTML = `Last time: <button class="link" type="button">${esc(acctLabel(sug))}</button>`;
      const l = hint.querySelector('button'); if (l) l.onclick = () => { $('#xac').value = sug; touched.xac = true; hint.textContent = ''; };
    } else if (sug) hint.textContent = 'Booked here last time for this vendor.';
    else hint.textContent = '';
  }
  // duplicate warning, live
  function paintDup() {
    const box = $('#xdup'); if (!box) return;
    const cur = { id: x.id, vendor: $('#xvn').value, amount: $('#xam').value, date: $('#xdt').value };
    const found = notDup ? [] : localDuplicates(cur, hash).map(d => ({ id: d.e.id, vendor: d.e.vendor, amount: d.e.amount, date: d.e.date, reason: d.reason }))
      .concat(serverDups.filter(sd => !localDuplicates(cur, hash).some(d => d.e.id === sd.id)));
    if (!found.length && !(x.dupOf && !notDup)) { box.innerHTML = ''; return; }
    const d = found[0] || (docById(x.dupOf) || expensesAll().find(e => e.id === x.dupOf) || {});
    box.innerHTML = `<div class="dupwarn"><b>⚠ Possible duplicate</b><div>${esc(d.reason || 'Matches another expense')}: ${esc(d.vendor || 'receipt')} · ${d.amount ? money(d.amount) : ''} · ${esc(fmtDate(d.date))}</div>
      <div class="grid2" style="margin-top:8px"><button class="btn sm ghost" type="button" id="dupOpen">Open the other one</button><button class="btn sm ghost" type="button" id="dupNo">Not a duplicate</button></div></div>`;
    $('#dupNo').onclick = () => { notDup = true; serverDups = []; paintDup(); };
    $('#dupOpen').onclick = () => { const o = expensesAll().find(e => e.id === d.id); if (o) expenseSheet(o); };
  }
  b.addEventListener('input', e => { if (e.target.id) touched[e.target.id] = true; if (e.target.id === 'xvn') suggest(); if (['xvn', 'xam', 'xdt'].includes(e.target.id)) paintDup(); });
  b.addEventListener('change', e => { if (e.target.id) touched[e.target.id] = true; if (e.target.id === 'xac') hint.textContent = '';
    if (e.target.id === 'xmt' && $('#xmt').value === 'Check' && !$('#xbk').value && !touched.xbk) $('#xbk').value = defaultBank();
    if (['xmt', 'xbk'].includes(e.target.id)) paintPaid(); });
  function paintPaid() { $('#xpbw').classList.toggle('hide', !!$('#xbk').value); $('#xckw').classList.toggle('hide', $('#xmt').value !== 'Check'); }
  paintPaid();

  const rc = $('#xrc'), fileIn = $('#xfile');
  function paintReceipt() {
    rc.innerHTML = '';
    if (status) rc.appendChild(el('div', 'scanstat' + (busy ? ' busy' : ''), status));
    const shown = preview || (!removeReceipt && RECEIPTS[x.id]);
    if (shown) {
      const im = el('img'); im.src = shown; im.alt = 'Receipt'; im.onclick = () => openViewer(shown, x.vendor || 'Receipt');
      const wrap = el('div', 'rimg'); wrap.appendChild(im);
      const z = el('button', 'zoombtn', '🔍 Zoom'); z.type = 'button'; z.onclick = () => openViewer(shown, x.vendor || 'Receipt');
      wrap.appendChild(z); rc.appendChild(wrap);
    } else if (x.file && !removeReceipt && !autoTried && navigator.onLine) {
      autoTried = true; loadReceipt();                       // show the photo right away, no extra tap
    }
    const row = el('div', 'grid2');
    if (shown || (x.receipt && !removeReceipt)) {
      if (!shown && !x.file && x.link) row.appendChild(btn('Open receipt in Drive', () => window.open(x.link, '_blank'), 'ghost'));
      else if (!shown) row.appendChild(btn(loadingRc ? 'Loading receipt…' : 'View receipt', () => loadReceipt(), 'ghost'));
      row.appendChild(btn('Replace photo', () => fileIn.click(), 'ghost'));
      row.appendChild(btn('Remove', () => { pending = null; scanned = null; preview = null; status = ''; removeReceipt = true; paintReceipt(); }, 'ghost dangertext'));
    } else {
      const add = btn('📷  Take or choose a receipt photo', () => fileIn.click(), 'ghost'); add.style.gridColumn = '1 / -1';
      row.appendChild(add);
    }
    rc.appendChild(row);
    if (x.checkFile || x.checkLink) {
      const cb = btn('View check photo', async (e) => {
        if (RECEIPTS['chk:' + x.id]) return openViewer(RECEIPTS['chk:' + x.id], 'Check' + (x.checkNo ? ' #' + x.checkNo : ''));
        if (!x.checkFile && x.checkLink) return window.open(x.checkLink, '_blank');
        const t = e.target; t.disabled = true; t.textContent = 'Loading…';
        try { const r = await call('getReceipt', { id: x.id, which: 'check' }); RECEIPTS['chk:' + x.id] = 'data:' + r.type + ';base64,' + r.data; openViewer(RECEIPTS['chk:' + x.id], 'Check' + (x.checkNo ? ' #' + x.checkNo : '')); }
        catch (err) { if (x.checkLink) window.open(x.checkLink, '_blank'); else toast(err.message, true); }
        t.disabled = false; t.textContent = 'View check photo';
      }, 'ghost');
      cb.classList.add('wide'); cb.style.marginTop = '8px'; rc.appendChild(cb);
    }
  }
  async function loadReceipt() {
    if (loadingRc) return;
    if (!navigator.onLine) return toast('Receipts open when you have signal.', true);
    loadingRc = true; paintReceipt();
    try { const r = await call('getReceipt', { id: x.id }); RECEIPTS[x.id] = 'data:' + r.type + ';base64,' + r.data; }
    catch (err) { toast(err.message, true); }
    loadingRc = false; if ($('#xrc') === rc) paintReceipt();
  }
  fileIn.onchange = async () => {
    const f = fileIn.files && fileIn.files[0]; fileIn.value = ''; if (!f) return;
    let img;
    try { [img, hash] = await Promise.all([shrinkImage(f, 1800, 0.8), fileHash(f)]); } catch (e) { return toast(e.message, true); }
    preview = img.preview; removeReceipt = false; scanned = null; pending = null;
    paintDup();
    if (!navigator.onLine) {
      pending = img; status = 'No signal — the photo uploads to Drive when you save. Type the details.'; paintReceipt(); return;
    }
    busy = true; status = 'Saving to Drive and reading the receipt…'; paintReceipt();
    try {
      const r = await call('scanReceipt', { business: x.business || BIZ, image: { data: img.data, type: img.type }, hash, id: x.id });
      scanned = { fileId: r.fileId, text: r.text || '' };
      serverDups = r.duplicates || [];
      const set = (id, val) => { const n = $('#' + id); if (n && val && !touched[id]) n.value = val; };
      set('xam', r.total ? r.total.toFixed(2) : '');
      set('xvn', r.vendor);
      if (r.date) set('xdt', r.date);
      if (r.account) set('xac', r.account);
      if (r.method) set('xmt', r.method);
      suggest();
      const got = [r.vendor, r.total ? money(r.total) : '', r.date ? fmtDate(r.date) : ''].filter(Boolean);
      status = !r.read ? '✓ Saved to Drive. Couldn’t read the text — type the details.'
        : got.length ? '✓ Saved to Drive · read ' + got.join(' · ') + '. Check it, then save.'
        : '✓ Saved to Drive. Couldn’t find a total — type the details.';
    } catch (e) {
      pending = img;
      status = 'Couldn’t reach the server — the photo uploads when you save. Type the details.';
    }
    busy = false; paintReceipt(); paintDup();
  };
  paintReceipt(); paintDup(); suggest();
  if (opts.scan) fileIn.click();                       // straight to camera / photo library
  else if (isNew) setTimeout(() => { const a = $('#xam'); if (a) a.focus(); }, 250);
}

function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
async function shareOrDownload(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) { /* cancelled */ }
    return;
  }
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function exportExpensesCsv(list) {
  if (!list.length) return toast('Nothing to export.', true);
  const rows = [['Date', 'Business', 'Vendor', 'Account #', 'Account', 'Type', 'Amount', 'Paid with', 'Paid from', 'Check #', 'Project', 'Customer', 'Note', 'Receipt link']];
  list.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(x => {
    const j = docById(x.job), a = acctOf(x.account);
    rows.push([x.date, companyOf(x.business || 'uffg').name || BIZ_NAMES[x.business || 'uffg'], x.vendor, a.code, a.name,
      a.type === 'cogs' ? 'Job cost' : 'Overhead', r2(x.amount).toFixed(2), x.method, x.bank ? bankLabel(bankById(x.bank)) : (x.paidBy ? x.paidBy + ' (own money)' : ''), x.checkNo || '',
      j ? jobLabel(j.id) : '', j ? custName(j.customer) : '', x.note, x.link || (x.receipt ? 'Yes' : '')]);
  });
  rows.push(['', '', '', '', '', 'Total', sum(list).toFixed(2), '', '', '', '', '', '', '']);
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const name = (BIZ_NAMES[BIZ] + ' expenses - ' + PERIOD_LABEL[EXP.period] + (EXP.cat ? ' - ' + EXP.cat : '')).replace(/[\\/:*?"<>|]+/g, '') + '.csv';
  window.__lastCsv = csv;
  await shareOrDownload(new Blob([csv], { type: 'text/csv' }), name, 'text/csv');
}

/* Shown inside an estimate or invoice: what the job cost and what's left. */
function jobCostsSection(v, d) {
  if (budgetSection(v, d)) return;
  const xs = jobExpenses(d).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const key = jobKeyOf(d), est = docById(key);
  const revenue = est && est.type === 'estimate' ? contractTotal(est) : totals(d).total;
  const cost = sum(xs), profit = r2(revenue - cost);
  v.appendChild(el('h2', null, 'Job costs'));
  const c = el('div', 'card');
  c.innerHTML = `<div class="trow"><span>${est && est.type === 'estimate' ? 'Contract' : 'Invoice'} total</span><span>${money(revenue)}</span></div>
    <div class="trow"><span>Expenses (${xs.length})</span><span>-${money(cost)}</span></div>
    <div class="trow big ${profit < 0 ? 'neg' : ''}"><span>Profit${revenue ? ' · ' + Math.round(profit / revenue * 100) + '%' : ''}</span><span>${money(profit)}</span></div>`;
  xs.slice(0, 6).forEach(x => {
    const r = el('div', 'row line'); r.style.cursor = 'pointer';
    r.innerHTML = `<div class="grow"><div class="ttl" style="font-weight:500">${esc(x.vendor || 'Expense')}${x.receipt ? ' 📎' : ''}</div><div class="meta">${esc(fmtDate(x.date) + ' · ' + acctOf(x.account).name)}</div></div><div class="amt">${money(x.amount)}</div>`;
    r.onclick = () => expenseSheet(x);
    c.appendChild(r);
  });
  if (xs.length > 6) c.appendChild(el('div', 'meta', '+ ' + (xs.length - 6) + ' more in Expenses'));
  const g2 = el('div', 'grid2'); g2.style.marginTop = '10px';
  g2.appendChild(btn('+ Add expense', () => expenseSheet(null, key), 'ghost'));
  g2.appendChild(btn('Set a budget', () => go('budget', jobDoc(d).id), 'ghost'));
  c.appendChild(g2);
  v.appendChild(c);
}

/* ===================== job budgets vs actuals (v2.6) ===================== */
/* A budget lives on the job (the estimate, or an invoice that didn't come from one).
   Each line is a category with an amount and the accounts whose expenses count toward it. */
const BUDGET_TEMPLATE = [
  ['Labor', ['Job labor', 'Subcontractors'], 'crew × day rate × days'], ['Materials', ['Job materials']],
  ['Hotel / housing', ['Job travel & lodging']], ['Food', ['Meals']], ['Gas', ['Fuel']],
  ['Drill bits & misc tools', ['Job supplies & small tools']], ['Equipment', ['Tools & small equipment', 'Equipment rental']],
  ['Insurance', ['Insurance']], ['Truck wear & tear', ['Vehicle repairs & maintenance']],
  ['Permits', ['Permits & inspections']], ['Dump fees', ['Dump & disposal']]
].map(([name, accounts, note]) => ({ name, amount: 0, accounts, note: note || '' }));

const jobDoc = d => docById(jobKeyOf(d)) || d;
const budgetOf = job => (job && Array.isArray(job.budget)) ? job.budget : [];
function jobRevenue(job) { return job.type === 'estimate' ? contractTotal(job) : totals(job).total; }

/* "4 x 350 x 10" or "1,700" → number. Only digits and + - * / x ( ) allowed. */
function calcAmount(s) {
  const t = String(s == null ? '' : s).replace(/[$,\s]/g, '').replace(/[x×]/gi, '*');
  if (!t) return 0;
  if (!/^[\d.+\-*/()]+$/.test(t)) return NaN;
  try { const n = Function('"use strict";return (' + t + ')')(); return isFinite(n) ? r2(n) : NaN; } catch (e) { return NaN; }
}

function budgetData(job) {
  const lines = budgetOf(job), xs = jobExpenses(job), used = new Set();
  const rows = lines.map(l => {
    (l.accounts || []).forEach(a => used.add(a));
    const mine = xs.filter(x => (l.accounts || []).includes(x.account));
    const actual = sum(mine);
    return { name: l.name, note: l.note, accounts: l.accounts || [], budget: r2(l.amount), actual, left: r2(l.amount - actual), xs: mine };
  });
  const other = xs.filter(x => !used.has(x.account));
  for (let i = rows.length - 1; i >= 0; i--) if (!rows[i].budget && !rows[i].actual) rows.splice(i, 1);   // empty template lines
  if (other.length) rows.push({ name: 'Not in the budget', note: [...new Set(other.map(x => acctOf(x.account).name))].join(', '), accounts: [], budget: 0, actual: sum(other), left: -sum(other), xs: other, other: true });
  const tB = r2(rows.reduce((s, r) => s + r.budget, 0)), tA = r2(rows.reduce((s, r) => s + r.actual, 0));
  const rev = jobRevenue(job);
  return { rows, tB, tA, left: r2(tB - tA), rev, profitB: r2(rev - tB), profitA: r2(rev - tA), count: xs.length };
}

/* ===================== profit & loss ===================== */
let PNL = { period: LS.get('uffg.pnlPeriod', 'year'), basis: LS.get('uffg.pnlBasis', 'cash') };

/* Income without sales tax: tax collected belongs to the state, not the business. */
function netOfTax(inv, amount) {
  const t = totals(inv); if (!t.total) return 0;
  return r2(amount * (t.total - t.tax) / t.total);
}
function pnlData(business, period, basis) {
  const rng = periodRange(period), inB = x => (x.business || 'uffg') === business;
  const invs = biz().docs.filter(d => d.type === 'invoice' && inB(d) && d.status !== 'Void' && d.status !== 'Draft');
  const incomeItems = [];
  if (basis === 'cash') {
    biz().payments.forEach(p => {
      const inv = invs.find(i => i.id === p.invoice);
      if (inv && (period === 'all' || inRange(p.date, rng))) incomeItems.push({ inv, amount: netOfTax(inv, p.amount), date: p.date });
    });
  } else {
    invs.forEach(inv => { if (period === 'all' || inRange(inv.date, rng)) { const t = totals(inv); incomeItems.push({ inv, amount: r2(t.total - t.tax), date: inv.date }); } });
  }
  const income = r2(incomeItems.reduce((s, i) => s + i.amount, 0));
  const xs = expensesAll().filter(x => inB(x) && booked(x) && (period === 'all' || inRange(x.date, rng)));
  const group = type => {
    const m = {};
    xs.filter(x => acctOf(x.account).type === type).forEach(x => { m[x.account || 'Uncategorized'] = r2((m[x.account || 'Uncategorized'] || 0) + x.amount); });
    return Object.keys(m).map(k => ({ account: k, label: acctLabel(k), amount: m[k] })).sort((a, b) => (acctOf(a.account).code || '9').localeCompare(acctOf(b.account).code || '9'));
  };
  const cogs = group('cogs'), opex = group('expense');
  const cogsT = r2(cogs.reduce((s, r) => s + r.amount, 0)), opexT = r2(opex.reduce((s, r) => s + r.amount, 0));
  const gross = r2(income - cogsT), net = r2(gross - opexT);
  // by project: income and job costs tied to each job
  const jobs = {};
  incomeItems.forEach(i => { const k = jobKeyOf(i.inv); (jobs[k] = jobs[k] || { inc: 0, cost: 0 }).inc = r2(jobs[k].inc + i.amount); });
  xs.filter(x => x.job).forEach(x => { (jobs[x.job] = jobs[x.job] || { inc: 0, cost: 0 }).cost = r2(jobs[x.job].cost + x.amount); });
  const projects = Object.keys(jobs).map(k => ({ id: k, label: jobLabel(k) || 'Unknown project', customer: docById(k) ? custName(docById(k).customer) : '',
    inc: jobs[k].inc, cost: jobs[k].cost, profit: r2(jobs[k].inc - jobs[k].cost) })).sort((a, b) => b.inc - a.inc || b.cost - a.cost);
  const drafts = expensesAll().filter(x => inB(x) && !booked(x));
  return { rng, income, incomeCount: incomeItems.length, cogs, cogsT, gross, opex, opexT, net, projects, drafts: drafts.length, draftsT: sum(drafts) };
}

  const pdf = btn('Share P&L as PDF', async () => {
    const bytes = buildPnlPdf(BIZ, PNL.period, PNL.basis);
    const name = (BIZ_NAMES[BIZ] + ' P&L - ' + PERIOD_LABEL[PNL.period]).replace(/[\\/:*?"<>|]+/g, '') + '.pdf';
    window.__lastPnlPdf = bytes;
    await shareOrDownload(new Blob([bytes], { type: 'application/pdf' }), name, 'application/pdf');
  }, 'ghost');

  v.appendChild(pdf);
  v.appendChild(el('div', 'sub', 'Sales tax you collect is left out of income.'));

}

function buildPnlPdf(business, period, basis) {
  const d = pnlData(business, period, basis), co = companyOf(business), isUB = business === 'uribest';
  const C = hexRgb(co.color, isUB ? [31, 79, 180] : [46, 107, 79]), MUT = [110, 116, 124], LINE = [222, 216, 205];
  const P = new PdfDoc(), M = 64, R = 612 - M;
  let y = 792 - 56;
  if (isUB) { P.wordmark(M, y - 22, 22, C); y -= 40; } else { P.logo(M, y - 46, 46, C); y -= 4; }
  P.text(isUB ? M : M + 58, isUB ? y : y - 16, co.name || BIZ_NAMES[business], { size: 12, bold: true });
  y -= isUB ? 30 : 64;
  P.text(306, y, 'Profit & Loss', { size: 20, bold: true, color: C, align: 'center' }); y -= 16;
  P.text(306, y, PERIOD_LABEL[period] + (period !== 'all' ? ' (' + fmtDate(d.rng[0]) + ' - ' + fmtDate(d.rng[1]) + ')' : '') + ' - ' + (basis === 'cash' ? 'Cash' : 'Accrual') + ' basis', { size: 9.5, color: MUT, align: 'center' });
  y -= 30;
  const row = (label, amt, o) => {
    o = o || {};
    if (o.bar) { P.rect(M - 6, y - 6, R - M + 12, 19, C); P.text(M, y, label, { size: 10.5, bold: true, color: [255, 255, 255] }); P.text(R, y, money(amt), { size: 10.5, bold: true, color: [255, 255, 255], align: 'right' }); y -= 26; return; }
    P.text(M + (o.indent ? 14 : 0), y, label, { size: o.bold ? 10.5 : 10, bold: !!o.bold, color: o.mut ? MUT : [21, 24, 28] });
    if (amt !== null) P.text(R, y, money(amt), { size: o.bold ? 10.5 : 10, bold: !!o.bold, align: 'right' });
    if (o.rule) P.line(M, y + 13, R, y + 13, LINE, 0.6);
    y -= o.bold ? 20 : 16;
  };
  const head = t => { y -= 4; P.text(M, y, t.toUpperCase(), { size: 8, bold: true, color: C }); y -= 15; };
  head('Income'); row('4000 - Job income', d.income, { indent: true }); row('Total income', d.income, { bold: true, rule: true });
  head('Cost of jobs'); (d.cogs.length ? d.cogs : [{ label: 'None', amount: 0 }]).forEach(r => row(r.label.replace(' · ', ' - '), r.amount, { indent: true }));
  row('Total cost of jobs', d.cogsT, { bold: true, rule: true });
  row('Gross profit', d.gross, { bar: true });
  head('Operating expenses'); (d.opex.length ? d.opex : [{ label: 'None', amount: 0 }]).forEach(r => row(r.label.replace(' · ', ' - '), r.amount, { indent: true }));
  row('Total operating expenses', d.opexT, { bold: true, rule: true });
  row('Net profit', d.net, { bar: true });
  if (d.projects.length) {
    y -= 10; head('Profit by project');
    d.projects.slice(0, 18).forEach(p => {
      if (y < 80) { P.addPage(); y = 792 - 56; }
      P.text(M + 14, y, (p.label + (p.customer ? ' - ' + p.customer : '')).slice(0, 60), { size: 9.5 });
      P.text(R - 150, y, 'in ' + money(p.inc), { size: 9, color: MUT, align: 'right' });
      P.text(R - 70, y, 'cost ' + money(p.cost), { size: 9, color: MUT, align: 'right' });
      P.text(R, y, money(p.profit), { size: 9.5, bold: true, align: 'right' });
      y -= 14;
    });
  }
  if (d.drafts) { y -= 8; P.text(M, y, d.drafts + ' receipt(s) totaling ' + money(d.draftsT) + ' still to review are not included.', { size: 8.5, color: MUT }); }
  P.pages.forEach(ops => { P.ops = ops; P.text(306, 30, 'Prepared ' + fmtDate(today()) + ' from the ' + (co.name || '') + ' app. Unaudited.', { size: 7.5, color: MUT, align: 'center' }); });
  return P.bytes();
}

/* ===================== banks, checks, vendors, balance sheet (v2.5) ===================== */
const BANK_TYPE_LABEL = { checking: 'Checking', savings: 'Savings', card: 'Credit card' };
const BANKING_LABEL = { contribution: 'Owner put money in', draw: 'Owner took money out', loan_in: 'Loan received', loan_pay: 'Loan payment',
  tax_pay: 'Sales tax paid', transfer: 'Transfer / card payment', reimburse: 'Paid someone back (out-of-pocket)' };
const banksAll = () => (biz().banks || []).filter(inBiz);
const banksOf = () => banksAll().filter(b => b.active !== false);
const bankById = id => (biz().banks || []).find(b => b.id === id);
const bankLabel = b => b ? b.name + (b.last4 ? ' ••' + b.last4 : '') : '';
const bankingAll = () => (biz().banking || []);
const vendorsOf = () => (biz().vendors || []).filter(inBiz);
const isCard = b => b && b.type === 'card';
function defaultBank(kind) {
  const bs = banksOf().filter(b => kind === 'card' ? isCard(b) : !isCard(b));
  return bs.length ? bs[0].id : '';
}
function bankOptions(sel, none) {
  return (none ? `<option value="">${esc(none)}</option>` : '') +
    banksOf().map(b => `<option value="${esc(b.id)}" ${b.id === sel ? 'selected' : ''}>${esc(bankLabel(b) + (isCard(b) ? ' (card)' : ''))}</option>`).join('');
}
function peopleNames() {
  return [...new Set((DATA.team || []).map(t => t.name).concat(expenses().map(x => x.paidBy)).filter(Boolean))];
}
function payeeNames() {
  return [...new Set(vendorsOf().map(v => v.name).concat(expenses().map(e => e.vendor)).filter(Boolean))].slice(0, 120);
}
const vendorByName = n => vendorsOf().find(v => vendorKey(v.name) === vendorKey(n));

/* ---- every dollar that moved through an account, signed as cash (+ in, − out) ---- */
function bankFlows(business) {
  const inB = x => (x.business || 'uffg') === business;
  const invIds = new Set(biz().docs.filter(d => d.type === 'invoice' && inB(d) && d.status !== 'Void' && d.status !== 'Draft').map(d => d.id));
  const out = [];
  biz().payments.forEach(p => { if (p.bank && invIds.has(p.invoice)) { const inv = docById(p.invoice);
    out.push({ bank: p.bank, date: p.date, amt: r2(p.amount), kind: 'payment', ref: p, label: 'Deposit · ' + (inv ? custName(inv.customer) : 'Customer'), sub: [inv && inv.number, p.method, p.note].filter(Boolean).join(' · ') }); } });
  expensesAll().forEach(x => { if (x.bank && inB(x) && booked(x))
    out.push({ bank: x.bank, date: x.date, amt: -r2(x.amount), kind: 'expense', ref: x, label: (x.checkNo ? 'Check #' + x.checkNo + ' · ' : '') + (x.vendor || 'Expense'), sub: [acctOf(x.account).name, jobLabel(x.job)].filter(Boolean).join(' · ') }); });
  bankingAll().forEach(t => { if (!inB(t)) return;
    const lab = BANKING_LABEL[t.type] || t.type, sub = [t.person, t.note].filter(Boolean).join(' · ');
    if (t.type === 'transfer') {
      out.push({ bank: t.bank, date: t.date, amt: -r2(t.amount), kind: 'banking', ref: t, label: 'Transfer to ' + bankLabel(bankById(t.toBank)), sub });
      out.push({ bank: t.toBank, date: t.date, amt: r2(t.amount), kind: 'banking', ref: t, label: 'Transfer from ' + bankLabel(bankById(t.bank)), sub });
    } else {
      const sign = (t.type === 'contribution' || t.type === 'loan_in') ? 1 : -1;
      out.push({ bank: t.bank, date: t.date, amt: sign * r2(t.amount), kind: 'banking', ref: t, label: lab, sub });
    }
  });
  return out;
}
/* Balance = opening balance + everything on/after the opening date. Older entries are already inside the opening balance. */
function bankState(b, flows, asOf) {
  const sign = isCard(b) ? -1 : 1, mine = flows.filter(f => f.bank === b.id);
  const pre = b.openingDate ? r2(mine.filter(f => f.date && f.date < b.openingDate).reduce((s, f) => s + f.amt, 0)) : 0;
  const base = r2(sign * (Number(b.opening) || 0) - pre);           // the "opening balance equity" for this account
  const bal = r2(base + mine.filter(f => !asOf || (f.date && f.date <= asOf)).reduce((s, f) => s + f.amt, 0));
  return { base, bal, owed: isCard(b) ? r2(-bal) : 0, flows: mine };
}

/* ---- Bank & cards list ---- */
function vBanks(v) {

/* ---- one account: running balance ---- */
function vBank(v, id) {
  const b = bankById(id); if (!b) { v.appendChild(el('div', 'empty', 'Account not found.')); return; }
  const st = bankState(b, bankFlows(b.business || 'uffg')), card_ = isCard(b);
  const s = el('div', 'stat');
  s.innerHTML = `<div><b>${money(card_ ? st.owed : st.bal)}</b><span>${card_ ? 'Owed now' : 'Balance now'}</span></div>
    <div class="tap" id="bkEdit"><b style="font-size:1rem">${esc(b.institution || '—')}</b><span>${esc(BANK_TYPE_LABEL[b.type])}${b.last4 ? ' ••' + esc(b.last4) : ''} · edit ›</span></div>`;
  v.appendChild(s); s.querySelector('#bkEdit').onclick = () => bankSheet(b);
  if (!b.openingDate) {
    const w = el('div', 'dupwarn tap', '<b>Set the starting balance</b>Enter the balance from a bank statement and its date, so this matches the bank.');
    w.onclick = () => bankSheet(b); v.appendChild(w);
  }
  const g = el('div', 'grid2'); g.style.marginBottom = '12px';
  if (!card_) g.appendChild(btn('✍ Record a check', () => checkSheet({ bank: b.id })));
  else g.appendChild(btn('+ Card charge', () => expenseSheet(null, '', { bank: b.id })));
  g.appendChild(btn('+ Other entry', () => bankTxSheet(null, b.id), 'ghost'));
  v.appendChild(g);
  // running balance, oldest first, shown newest first
  const rows = st.flows.slice().sort((a, c) => (a.date || '').localeCompare(c.date || '') || (a.ref.created || '').localeCompare(c.ref.created || ''));
  let run = st.base;
  rows.forEach(r => { run = r2(run + r.amt); r.run = run; r.before = b.openingDate && r.date < b.openingDate; });
  if (!rows.length) v.appendChild(el('div', 'empty', card_ ? 'No charges yet. Pick this card as “Paid from” on an expense.' : 'Nothing yet. Record a check, or pick this account when you record a payment.'));
  let last = '';
  rows.reverse().forEach(r => {
    if (r.date !== last) { last = r.date; v.appendChild(el('div', 'dhead', esc(fmtDate(r.date) || 'No date'))); }
    const amt = card_ ? -r.amt : r.amt;
    const c = card(`<div class="row"><div class="grow"><div class="ttl">${esc(r.label)}</div><div class="meta">${esc(r.sub)}${r.before ? ' · before starting balance' : ''}</div></div>
      <div class="rcol"><div class="amt ${amt < 0 ? '' : 'pos'}">${amt > 0 ? '+' : ''}${money(amt)}</div><div class="meta">${money(card_ ? -r.run : r.run)}</div></div></div>`, () => {
      if (r.kind === 'expense') expenseSheet(r.ref);
      else if (r.kind === 'payment') openDoc(r.ref.invoice);
      else bankTxSheet(r.ref);
    });
    v.appendChild(c);
  });
}

/* ---- a check: snap it, read it, match it to what it paid ---- */
function checkSheet(opts) {
  opts = opts || {};
  if (!banksOf().filter(b => !isCard(b)).length) { toast('Add the checking account first (More → Bank & cards).', true); return go('banks'); }
  const x = { id: uid(), business: BIZ, status: 'Booked', date: today(), vendor: '', account: '', amount: 0, method: 'Check', job: opts.job || '', note: '',
              bank: opts.bank || defaultBank(), checkNo: '' };
  let scanned = null, pending = null, preview = null, status = '', busy = false, matchId = '', serverMatches = [], sameNo = [];
  const touched = {};
  const jobs = jobOptions();
  const acctOpts = sel => ['cogs', 'expense'].map(t => `<optgroup label="${t === 'cogs' ? 'Job costs' : 'Overhead'}">` +
    accounts().filter(a => a.type === t).map(a => `<option value="${esc(a.name)}" ${a.name === sel ? 'selected' : ''}>${esc(a.code + ' · ' + a.name)}</option>`).join('') + '</optgroup>').join('');
  const f = el('div');
  f.innerHTML = `<div class="receipt" id="crc"></div><input id="cfile" type="file" accept="image/*" class="hide">
    <div id="cmatch"></div>` +
    `<div class="grid2">` + field('Check #', `<input id="cno" inputmode="numeric" placeholder="1227">`) + field('Date', `<input id="cdt" type="date" value="${today()}">`) + `</div>` +
    field('Pay to', `<input id="cpy" list="cpl" placeholder="Vendor or subcontractor" autocomplete="off"><datalist id="cpl">${payeeNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>`) +
    `<label class="check"><input type="checkbox" id="csub"> Subcontractor (track what we pay them for 1099s)</label>` +
    `<div class="grid2">` + field('Amount $', `<input id="cam" class="money" type="number" inputmode="decimal" step="0.01" placeholder="0.00">`) +
    field('From account', `<select id="cbk">${banksOf().filter(b => !isCard(b)).map(b => `<option value="${esc(b.id)}" ${b.id === x.bank ? 'selected' : ''}>${esc(bankLabel(b))}</option>`).join('')}</select>`) + `</div>` +
    `<div id="cnew">` + field('Book to account', `<select id="cac"><option value="">Pick an account…</option>${acctOpts('')}</select><div class="hint" id="cah"></div>`) +
    field('Project (for job costing)', `<select id="cjb"><option value="">No project — general overhead</option>${jobs.map(j => `<option value="${esc(j.id)}" ${j.id === x.job ? 'selected' : ''}>${esc(jobLabel(j.id) + ' — ' + custName(j.customer))}</option>`).join('')}</select>`) + `</div>` +
    field('Memo', `<input id="cmo" placeholder="What it was for">`);
  f.appendChild(btn('Save check', save));
  openSheet('Check · ' + BIZ_NAMES[BIZ], f);

  function localMatches() {
    const amt = r2($('#cam').value), d = $('#cdt').value, pk = vendorKey($('#cpy').value);
    if (!amt) return [];
    return expenses().filter(e => !e.checkNo && Math.abs(r2(e.amount) - amt) < 0.005 &&
      (!d || !e.date || Math.abs(new Date(e.date) - new Date(d)) <= 60 * 864e5))
      .sort((a, b) => (vendorKey(b.vendor) === pk) - (vendorKey(a.vendor) === pk)).slice(0, 4);
  }
  function paintMatch() {
    const box = $('#cmatch'); if (!box) return;

    const dupNo = no ? expenses().filter(e => e.checkNo === no && (!e.bank || e.bank === bk)) : [];
    const ms = localMatches(); serverMatches.forEach(m => { if (!ms.find(e => e.id === m.id)) { const e = expensesAll().find(z => z.id === m.id) || m; ms.push(e); } });
    let h = '';
    if (dupNo.length) h += `<div class="dupwarn"><b>⚠ Check #${esc(no)} is already recorded</b>${esc(dupNo[0].vendor || '')} · ${money(dupNo[0].amount)} · ${esc(fmtDate(dupNo[0].date))}</div>`;
    if (ms.length) {

    if (scanned) payload.checkFile = scanned.fileId; else if (pending) payload.checkImage = { data: pending.data, type: pending.type };

/* ===================== balance sheet ===================== */
let BS = { asOf: LS.get('uffg.bsAsOf', 'today') };
function bsDate(k) {
  const t = new Date();
  if (k === 'lastmonth') return ymd(new Date(t.getFullYear(), t.getMonth(), 0));
  if (k === 'lastyear') return (t.getFullYear() - 1) + '-12-31';
  if (k === 'quarter') { const q = Math.floor(t.getMonth() / 3) * 3; return ymd(new Date(t.getFullYear(), q, 0)); }
  return today();
}
function bsData(business, asOf) {
  const inB = x => (x.business || 'uffg') === business, upTo = d => !!d && d <= asOf;
  const yStart = asOf.slice(0, 4) + '-01-01';
  const invs = biz().docs.filter(d => d.type === 'invoice' && inB(d) && d.status !== 'Void' && d.status !== 'Draft');
  const invIds = new Set(invs.map(i => i.id));
  const pays = biz().payments.filter(p => invIds.has(p.invoice) && upTo(p.date));
  const flows = bankFlows(business);
  const banks = (biz().banks || []).filter(inB).map(b => Object.assign({ b }, bankState(b, flows, asOf)));
  const cash = banks.filter(x => !isCard(x.b)), cards = banks.filter(x => isCard(x.b));
  const undeposited = r2(pays.filter(p => !p.bank).reduce((s, p) => s + p.amount, 0));
  const invTot = invs.filter(i => upTo(i.date)), arRaw = r2(invTot.reduce((s, i) => s + totals(i).total, 0) - pays.reduce((s, p) => s + p.amount, 0));
  const bk = bankingAll().filter(t => inB(t) && upTo(t.date)), bsum = type => r2(bk.filter(t => t.type === type).reduce((s, t) => s + t.amount, 0));
  const taxDue = r2(invTot.reduce((s, i) => s + totals(i).tax, 0) - bsum('tax_pay'));
  const loans = r2(bsum('loan_in') - bsum('loan_pay'));
  const xs = expensesAll().filter(x => inB(x) && booked(x) && upTo(x.date));
  const owed = {};
  xs.filter(x => !x.bank).forEach(x => { const k = x.paidBy || 'Not set'; owed[k] = r2((owed[k] || 0) + x.amount); });
  bk.filter(t => t.type === 'reimburse').forEach(t => { const k = t.person || 'Not set'; owed[k] = r2((owed[k] || 0) - t.amount); });
  const ni = (from, to) => r2(invs.filter(i => i.date && i.date >= from && i.date <= to).reduce((s, i) => { const t = totals(i); return s + t.total - t.tax; }, 0) -
    xs.filter(x => x.date >= from && x.date <= to).reduce((s, x) => s + x.amount, 0));
  const assets = cash.map(x => ({ label: bankLabel(x.b), amount: x.bal, bank: x.b.id }));
  if (undeposited) assets.push({ label: 'Payments not deposited yet', amount: undeposited });
  if (arRaw > 0) assets.push({ label: 'Accounts receivable (customers owe)', amount: arRaw });
  const liabs = cards.map(x => ({ label: bankLabel(x.b) + ' (card balance)', amount: x.owed, bank: x.b.id }));
  if (arRaw < 0) liabs.push({ label: 'Customer deposits (paid before invoiced)', amount: -arRaw });
  if (taxDue) liabs.push({ label: 'Sales tax to pay', amount: taxDue });
  if (loans) liabs.push({ label: 'Loans', amount: loans });
  Object.keys(owed).filter(k => owed[k]).sort().forEach(k => liabs.push({ label: k === 'Not set' ? 'Out-of-pocket expenses (who paid not set)' : 'Owed to ' + k + ' (out-of-pocket expenses)', amount: owed[k], person: k }));
  const obe = r2(banks.reduce((s, x) => s + x.base, 0));
  const equity = [];
  if (obe) equity.push({ label: 'Starting balances (opening equity)', amount: obe });
  if (bsum('contribution')) equity.push({ label: 'Owner contributions', amount: bsum('contribution') });
  if (bsum('draw')) equity.push({ label: 'Owner draws', amount: -bsum('draw') });
  const re = ni('0000-01-01', addDays(yStart, -1)), cur = ni(yStart, asOf);
  if (re) equity.push({ label: 'Retained earnings (prior years)', amount: re });
  equity.push({ label: 'Net income this year', amount: cur });
  const T = list => r2(list.reduce((s, r) => s + r.amount, 0));
  const tA = T(assets), tL = T(liabs), tE = T(equity);
  return { asOf, assets, liabs, equity, tA, tL, tE, off: r2(tA - tL - tE), noOpening: cash.concat(cards).filter(x => !x.b.openingDate).map(x => x.b),
           drafts: expensesAll().filter(x => inB(x) && !booked(x)).length };
}

  c.querySelectorAll('[data-bank]').forEach(r => r.onclick = () => go('bank', r.dataset.bank));
  v.appendChild(c);
  v.appendChild(el('div', 'sub', Math.abs(d.off) < 0.01 ? '✓ Balanced: assets equal liabilities plus equity. Invoices count when sent; sales tax is held separately.' : 'Off by ' + money(d.off) + ' — tell Michelle.'));
  const g = el('div', 'grid2'); g.style.marginTop = '12px';
  g.appendChild(btn('Bank & cards', () => go('banks'), 'ghost'));
  g.appendChild(btn('Share as PDF', async () => {
    const bytes = buildBsPdf(BIZ, asOf); window.__lastBsPdf = bytes;
    await shareOrDownload(new Blob([bytes], { type: 'application/pdf' }), (BIZ_NAMES[BIZ] + ' balance sheet ' + asOf) + '.pdf', 'application/pdf');
  }, 'ghost'));
  v.appendChild(g);

function buildBsPdf(business, asOf) {
  const d = bsData(business, asOf), co = companyOf(business), isUB = business === 'uribest';
  const C = hexRgb(co.color, isUB ? [31, 79, 180] : [46, 107, 79]), MUT = [110, 116, 124], LINE = [222, 216, 205];
  const P = new PdfDoc(), M = 64, R = 612 - M;
  let y = 792 - 56;
  if (isUB) { P.wordmark(M, y - 22, 22, C); y -= 40; } else { P.logo(M, y - 46, 46, C); y -= 4; }
  P.text(isUB ? M : M + 58, isUB ? y : y - 16, co.name || BIZ_NAMES[business], { size: 12, bold: true });
  y -= isUB ? 30 : 64;
  P.text(306, y, 'Balance Sheet', { size: 20, bold: true, color: C, align: 'center' }); y -= 16;
  P.text(306, y, 'As of ' + fmtDate(asOf), { size: 9.5, color: MUT, align: 'center' }); y -= 30;
  const row = (label, amt, o) => {
    o = o || {};
    if (y < 70) { P.addPage(); y = 792 - 56; }
    if (o.bar) { P.rect(M - 6, y - 6, R - M + 12, 19, C); P.text(M, y, label, { size: 10.5, bold: true, color: [255, 255, 255] }); P.text(R, y, money(amt), { size: 10.5, bold: true, color: [255, 255, 255], align: 'right' }); y -= 26; return; }
    P.text(M + (o.indent ? 14 : 0), y, label, { size: o.bold ? 10.5 : 10, bold: !!o.bold });
    P.text(R, y, money(amt), { size: o.bold ? 10.5 : 10, bold: !!o.bold, align: 'right' });
    if (o.rule) P.line(M, y + 13, R, y + 13, LINE, 0.6);
    y -= o.bold ? 20 : 16;
  };
  const head = t => { y -= 4; P.text(M, y, t.toUpperCase(), { size: 8, bold: true, color: C }); y -= 15; };
  head('Assets'); (d.assets.length ? d.assets : [{ label: 'None', amount: 0 }]).forEach(r => row(r.label, r.amount, { indent: true }));
  row('Total assets', d.tA, { bar: true });
  head('Liabilities'); (d.liabs.length ? d.liabs : [{ label: 'None', amount: 0 }]).forEach(r => row(r.label, r.amount, { indent: true }));
  row('Total liabilities', d.tL, { bold: true, rule: true });
  head('Equity'); d.equity.forEach(r => row(r.label, r.amount, { indent: true }));
  row('Total equity', d.tE, { bold: true, rule: true });
  row('Total liabilities & equity', r2(d.tL + d.tE), { bar: true });
  P.pages.forEach(ops => { P.ops = ops; P.text(306, 30, 'Prepared ' + fmtDate(today()) + ' from the ' + (co.name || '') + ' app. Unaudited.', { size: 7.5, color: MUT, align: 'center' }); });
  return P.bytes();
}

    for (let i = 0; i < out.length; i++) b[i] = out.charCodeAt(i) & 255;
    return b;
  }
}

function hexRgb(h, fb) {
  const m = String(h || '').trim().match(/^#?([0-9a-f]{6})$/i);
  if (!m) return fb;
  const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function buildPdf(d) {
  const bk = d.business || 'uffg', isUB = bk === 'uribest';
  const co = companyOf(bk), cust = customerById(d.customer) || { name: '' }, t = totals(d);
  const GREEN = hexRgb(co.color, isUB ? [31, 79, 180] : [46, 107, 79]);
  const P = new PdfDoc(), M = 48, R = 612 - M, INK = [21, 24, 28], MUT = [110, 116, 124], LINE = [222, 216, 205];
  const TINT = isUB ? [234, 239, 249] : [239, 235, 227];
  const title = { estimate: 'ESTIMATE', invoice: 'INVOICE', change: 'CHANGE ORDER' }[d.type];
  let y = 792 - M;

  // header: brand mark + company (left), title + numbers (right)
  const info = [].concat(co.contact ? [co.contact] : [], (co.address || '').split('\n'),
    [[co.phone, co.email].filter(Boolean).join('  -  ')], co.license ? ['Lic. ' + co.license] : []).filter(Boolean);
  let ly;
  if (isUB) {
    P.wordmark(M, y - 24, 24, GREEN);                 // ~172pt wide
    ly = y - 40;
    P.text(M, ly, co.name || 'Uribest Carports & Repairs LLC', { size: 10.5, bold: true }); ly -= 12.5;
    if (co.tagline) { P.text(M, ly, co.tagline.toUpperCase().split('').join(' '), { size: 7.5, bold: true, color: GREEN }); ly -= 12.5; }
    info.forEach(s => { P.text(M, ly, s, { size: 9, color: MUT }); ly -= 11.5; });
  } else {
    P.logo(M, y - 58, 58, GREEN);
    ly = y - 14;
    P.text(M + 72, ly, co.name || 'UFFG Construction LLC', { size: 14, bold: true }); ly -= 14;
    if (co.tagline) { P.text(M + 72, ly, co.tagline, { size: 9, color: GREEN }); ly -= 11.5; }
    info.forEach(s => { P.text(M + 72, ly, s, { size: 9, color: MUT }); ly -= 11.5; });
  }
  P.text(R, y - 18, title, { size: 22, bold: true, color: GREEN, align: 'right' });
  let ry = y - 38;
  const meta = [[(d.type === 'change' ? 'Change order' : title.charAt(0) + title.slice(1).toLowerCase()) + ' #', d.number || 'DRAFT'], ['Date', fmtDate(d.date)]];
  if (d.type === 'estimate' && d.due) meta.push(['Valid until', fmtDate(d.due)]);
  if (d.type === 'invoice' && d.due) meta.push(['Due', fmtDate(d.due)]);
  meta.forEach(([k, v]) => { P.text(R - 92, ry, k, { size: 9, color: MUT, align: 'right' }); P.text(R, ry, v, { size: 9, bold: true, align: 'right' }); ry -= 12.5; });
  if (d.type === 'invoice' && d.status === 'Paid') { P.text(R, ry - 4, 'PAID', { size: 16, bold: true, color: GREEN, align: 'right' }); ry -= 20; }
  y = Math.min(ly, ry, y - 66) - 16;
  P.line(M, y, R, y, LINE, 0.8); y -= 18;

  // customer + job
  const colB = 330;
  P.text(M, y, d.type === 'invoice' ? 'BILL TO' : 'PREPARED FOR', { size: 8, bold: true, color: GREEN });
  P.text(colB, y, 'JOB', { size: 8, bold: true, color: GREEN });
  let cy = y - 14, jy = y - 14;
  [[cust.name, true], [cust.company], ...((cust.address || '').split('\n').map(s => [s])), [cust.phone], [cust.email]]
    .filter(r => r[0]).forEach(([s, b]) => { wrapText(s, 10, !!b, colB - M - 16).forEach(w => { P.text(M, cy, w, { size: 10, bold: !!b }); cy -= 13; }); });
  [[d.title, true], ...((d.site || cust.address || '').split('\n').map(s => [s]))]
    .filter(r => r[0]).forEach(([s, b]) => { wrapText(s, 10, !!b, R - colB).forEach(w => { P.text(colB, jy, w, { size: 10, bold: !!b }); jy -= 13; }); });
  y = Math.min(cy, jy) - 10;

  const parent = d.type === 'change' ? docById(d.parent) : null;
  if (parent) {
    P.rect(M, y - 26, R - M, 26, TINT);
    P.text(M + 10, y - 17, 'This change order modifies estimate ' + parent.number + (parent.title ? ' - ' + parent.title : '') + (parent.approvedAt ? ', approved ' + fmtDate(parent.approvedAt.slice(0, 10)) : '') + '.', { size: 9.5 });
    y -= 40;
  }

  // table
  const cQ = 392, cR = 470, cA = R - 8, descW = cQ - 50 - (M + 8);
  const header = () => {
    P.rect(M, y - 20, R - M, 20, GREEN);
    const o = { size: 8.5, bold: true, color: [255, 255, 255] };
    P.text(M + 8, y - 13.5, 'DESCRIPTION', o); P.text(cQ, y - 13.5, 'QTY', Object.assign({ align: 'right' }, o));
    P.text(cR, y - 13.5, 'RATE', Object.assign({ align: 'right' }, o)); P.text(cA, y - 13.5, 'AMOUNT', Object.assign({ align: 'right' }, o));
    y -= 28;
  };
  const room = need => { if (y - need < 70) { P.addPage(); y = 792 - M; header(); } };
  header();
  if (!d.lines.length) { P.text(M + 8, y - 4, 'No items', { size: 10, color: MUT }); y -= 18; }
  d.lines.forEach(l => {
    if (l.heading) {
      room(30); y -= 4;
      P.rect(M, y - 16, R - M, 18, TINT);
      P.text(M + 8, y - 10.5, l.name, { size: 10, bold: true });
      y -= 24; return;
    }
    const nameL = wrapText(l.name || '', 10, true, descW), descL = l.desc ? wrapText(l.desc, 9, false, descW) : [];
    const h = nameL.length * 12.5 + descL.length * 11 + 8;
    room(h);
    let yy = y - 2;
    nameL.forEach((s, i) => { P.text(M + 8, yy, s, { size: 10, bold: true }); yy -= 12.5; });
    descL.forEach(s => { P.text(M + 8, yy, s, { size: 9, color: MUT }); yy -= 11; });
    P.text(cQ, y - 2, fmtQty(l.qty) + (l.unit ? ' ' + l.unit : ''), { size: 10, align: 'right' });
    P.text(cR, y - 2, money(l.rate), { size: 10, align: 'right' });
    P.text(cA, y - 2, money(r2(l.qty * l.rate)), { size: 10, align: 'right' });
    y -= h; P.line(M, y + 4, R, y + 4, LINE, 0.5); y -= 6;
  });

  // totals
  const rows = [['Subtotal', money(t.subtotal)]];
  if (t.discount) rows.push(['Discount', '-' + money(t.discount)]);
  if (t.tax) rows.push(['Tax (' + d.taxRate + '%)', money(t.tax)]);
  rows.push([d.type === 'change' ? 'This change order' : 'Total', money(t.total), 'bold']);
  if (d.type === 'estimate' && Number(d.deposit)) rows.push(['Deposit due to start (' + d.deposit + '%)', money(r2(t.total * d.deposit / 100))]);
  if (d.type === 'invoice') { rows.push(['Paid', '-' + money(d.paid || 0)]); rows.push(['Balance due', money(r2(t.total - (d.paid || 0))), 'big']); }
  if (parent) {
    const prev = changeOrdersOf(parent.id).filter(c => c.id !== d.id && c.status === 'Approved' && (!d.number || (c.number || '').localeCompare(d.number, undefined, { numeric: true }) < 0));
    const orig = totals(parent).total, prevSum = r2(prev.reduce((s, c) => s + totals(c).total, 0));
    rows.push(['Original estimate', money(orig)]);
    if (prev.length) rows.push(['Previous change orders', money(prevSum)]);
    rows.push(['New contract total', money(r2(orig + prevSum + t.total)), 'big']);
  }
  room(rows.length * 17 + 10);
  y -= 6;
  const tx = R - 230;
  rows.forEach(r => {
    if (r[2] === 'big') { P.rect(tx - 8, y - 6, R - tx + 8, 20, GREEN); P.text(tx, y, r[0], { size: 10.5, bold: true, color: [255, 255, 255] }); P.text(cA, y, r[1], { size: 10.5, bold: true, color: [255, 255, 255], align: 'right' }); y -= 24; return; }
    P.text(tx, y, r[0], { size: 10, bold: r[2] === 'bold', color: r[2] ? INK : MUT });
    P.text(cA, y, r[1], { size: 10, bold: r[2] === 'bold', align: 'right' });
    if (r[2] === 'bold') P.line(tx - 8, y + 13, R, y + 13, LINE, 0.6);
    y -= 17;
  });

  // notes, terms
  [['NOTES', d.notes], ['TERMS', d.terms]].forEach(([h, s]) => {
    if (!s) return;
    const ls = wrapText(s, 9.5, false, R - M);
    room(26 + ls.length * 12); y -= 12;
    P.text(M, y, h, { size: 8, bold: true, color: GREEN }); y -= 14;
    ls.forEach(x => { room(12); P.text(M, y, x, { size: 9.5 }); y -= 12; });
  });

  // signature
  if (d.type !== 'invoice') {
    room(70); y -= 34;
    P.line(M, y, M + 250, y, INK, 0.7); P.line(M + 290, y, M + 420, y, INK, 0.7);
    P.text(M, y - 12, 'Customer approval', { size: 8.5, color: MUT }); P.text(M + 290, y - 12, 'Date', { size: 8.5, color: MUT });
    y -= 20;
  }

  // footers
  const n = P.pages.length;
  P.pages.forEach((ops, i) => {
    P.ops = ops;
    P.text(306, 30, [co.name || (isUB ? 'Uribest Carports & Repairs LLC' : 'UFFG Construction LLC'), d.number || 'Draft', n > 1 ? 'Page ' + (i + 1) + ' of ' + n : ''].filter(Boolean).join('   ·   ').replace(/·/g, '-'), { size: 8, color: MUT, align: 'center' });
  });
  return P.bytes();
}

function pdfName(d) {
  const c = customerById(d.customer);
  return (TYPE_LABEL[d.type] + ' ' + (d.number || 'draft') + (c ? ' - ' + c.name : '')).replace(/[\\/:*?"<>|]+/g, '') + '.pdf';
}
function pdfSheet() {
  if (DIRTY || EDIT._new) saveEdit(true);
  const d = EDIT;
  let bytes;
  try { bytes = buildPdf(d); } catch (e) { return toast('Could not make the PDF: ' + e.message, true); }
  const name = pdfName(d);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const file = new File([blob], name, { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  window.__lastPdf = { name, size: bytes.length };
  const b = el('div');
  b.innerHTML = `<p class="sub" style="margin:4px 0 12px">${esc(name)}${d.number ? '' : '<br>It will say DRAFT until it finishes saving and gets a number.'}</p>`;
  const acts = el('div', 'actions');
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    acts.appendChild(btn('Share or save PDF', async () => {
      try { await navigator.share({ files: [file], title: name }); } catch (e) { /* user cancelled */ }
    }));
  }
  const open = el('a', 'btn ghost', 'Open PDF'); open.href = url; open.target = '_blank'; open.rel = 'noopener';
  acts.appendChild(open);
  const dl = el('a', 'btn ghost', 'Download'); dl.href = url; dl.download = name;
  acts.appendChild(dl);
  if (d.status === 'Draft' && d.type !== 'invoice') acts.appendChild(btn('Mark as sent', () => { closeSheet(); setStatus('Sent'); }, 'ghost'));
  if (d.status === 'Draft' && d.type === 'invoice') acts.appendChild(btn('Mark as sent', () => { closeSheet(); setStatus('Sent'); }, 'ghost'));
  b.appendChild(acts);
  openSheet('PDF ready', b);
}

function paintOnline() {
  $('#offline').classList.toggle('hide', navigator.onLine);
  if (navigator.onLine) flush();
}
window.addEventListener('online', paintOnline);
window.addEventListener('offline', paintOnline);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { paintOnline(); refresh(); } });

(async function boot() {
  paintOnline(); paintQueue();
  if (!TOKEN) { showAuth(); return; }

/* ---- full-screen photo viewer: pinch, double-tap, drag, rotate ---- */
const VW = { s: 1, x: 0, y: 0, r: 0, pts: new Map(), start: null, lastTap: 0 };
function vApply() { $('#vImg').style.transform = `translate(-50%,-50%) translate(${VW.x}px,${VW.y}px) rotate(${VW.r}deg) scale(${VW.s})`; }
function vReset() { VW.s = 1; VW.x = 0; VW.y = 0; vApply(); }
function openViewer(src, title) {
  $('#vImg').src = src; $('#vTitle').textContent = title || '';
  VW.r = 0; vReset(); $('#viewer').classList.remove('hide');
}
function closeViewer() { $('#viewer').classList.add('hide'); $('#vImg').removeAttribute('src'); }
window.openViewer = openViewer;
(function viewerGestures() {
  const st = $('#vStage');
  const zoomAt = (ns, cx, cy) => {               // keep the point under the finger in place
    ns = Math.min(8, Math.max(1, ns));
    const r = st.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
    VW.x = px - (px - VW.x) * ns / VW.s; VW.y = py - (py - VW.y) * ns / VW.s; VW.s = ns;
    if (VW.s === 1) { VW.x = 0; VW.y = 0; }
    vApply();
  };
  st.addEventListener('pointerdown', e => {
    st.setPointerCapture(e.pointerId); VW.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (VW.pts.size === 1) {
      const now = Date.now();
      if (now - VW.lastTap < 300) { zoomAt(VW.s > 1.2 ? 1 : 2.6, e.clientX, e.clientY); VW.lastTap = 0; }
      else VW.lastTap = now;
    }
    const p = [...VW.pts.values()];
    VW.start = { s: VW.s, x: VW.x, y: VW.y, p: p.map(q => ({ ...q })),
      d: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0 };
  });
  st.addEventListener('pointermove', e => {
    if (!VW.pts.has(e.pointerId) || !VW.start) return;
    VW.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...VW.pts.values()], s0 = VW.start;
    if (p.length > 1 && s0.d) {
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      const m0x = (s0.p[0].x + s0.p[1].x) / 2, m0y = (s0.p[0].y + s0.p[1].y) / 2;
      VW.s = s0.s; VW.x = s0.x + (mx - m0x); VW.y = s0.y + (my - m0y);
      zoomAt(s0.s * d / s0.d, mx, my);
    } else if (p.length === 1 && VW.s > 1) {
      VW.x = s0.x + (p[0].x - s0.p[0].x); VW.y = s0.y + (p[0].y - s0.p[0].y); vApply();
    }
  });
  const up = e => {
    VW.pts.delete(e.pointerId);
    const p = [...VW.pts.values()];
    VW.start = p.length ? { s: VW.s, x: VW.x, y: VW.y, p: p.map(q => ({ ...q })), d: 0 } : null;
  };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  st.addEventListener('wheel', e => { e.preventDefault(); zoomAt(VW.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  document.addEventListener('gesturestart', e => { if (!$('#viewer').classList.contains('hide')) e.preventDefault(); });
  $('#vClose').onclick = closeViewer;
  $('#vFit').onclick = vReset;
  $('#vRot').onclick = () => { VW.r = (VW.r + 90) % 360; vApply(); };
})();

/* Installed app on iPhone: if the page is shorter than the screen, measure the strip so bottom bars sit on the edge. */
function fixBottomGap() {
  let g = 0;
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    const portrait = window.innerHeight >= window.innerWidth;
    const H = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    g = Math.round(H - window.innerHeight);
    if (g < 2 || g > 120) g = 0;
  }
  document.documentElement.style.setProperty('--gap', g + 'px');
}
fixBottomGap();
['resize', 'orientationchange', 'pageshow'].forEach(ev => window.addEventListener(ev, () => setTimeout(fixBottomGap, 60)));
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(fixBottomGap, 60); });

if ('serviceWorker' in navigator) {
  // When a newer version takes over, reload once so it's used right away.
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || (DIRTY && route().view === 'doc') || BDIRTY || $('#sheet').classList.contains('on')) return;
    reloaded = true; location.reload();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
