<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UFFG">
<title>UFFG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --green:#2E6B4F; --green-d:#1E4B37; --green-deep:#15372A;
  --cream:#EFEBE3; --cream2:#F7F5F1; --ink:#15181C; --mut:#6E747C; --line:#DED8CD;
  --red:#A33A28; --amber:#B07D1A; --white:#fff;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tabh:62px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--cream2);color:var(--ink);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- chrome ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--green);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.top img{height:30px;width:auto;border-radius:4px}
.top h1{font-size:1rem;font-weight:600;letter-spacing:.04em;margin:0;flex:1}
.top .who{font-size:.72rem;opacity:.85;text-align:right;line-height:1.2}
main{padding:14px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{
  background:none;border:0;padding:9px 4px 10px;font-size:.66rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.tabs button .ic{font-size:1.15rem;line-height:1}
.tabs button.on{color:var(--green)}

/* ---------- bits ---------- */
h2{font-size:1.18rem;margin:0 0 12px}
.sub{color:var(--mut);font-size:.88rem;margin:-6px 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.ttl{font-weight:600;line-height:1.25}
.meta{font-size:.8rem;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.pill{
  display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;background:var(--cream);color:var(--green-d);white-space:nowrap;
}
.pill.bad{background:#F6E2DE;color:var(--red)}
.pill.warn{background:#F8EFD8;color:var(--amber)}
.pill.out{background:#E3EAF6;color:#2F4A63}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--green);color:#fff;border:1.5px solid var(--green);
  border-radius:8px;padding:12px 16px;font-size:.92rem;font-weight:600;cursor:pointer;
}
.btn:active{background:var(--green-d)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:9px 12px;font-size:.84rem}
.btn.wide{width:100%}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
input,select,textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,107,79,.15)}
.field{margin-bottom:12px}
.err{background:#F6E2DE;color:var(--red);padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
.ok{background:#E2EFE7;color:var(--green-d);padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:34px 16px;font-size:.92rem}
.search{margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chips button{
  flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:7px 13px;font-size:.8rem;color:var(--mut);cursor:pointer;white-space:nowrap;
}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.banner{
  background:var(--green-deep);color:#fff;font-size:.8rem;padding:8px 14px;text-align:center;
}
.banner.warn{background:var(--amber)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.stat div.alert b{color:var(--red)}

/* ---------- sheet (bottom modal) ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,24,28,.5);z-index:50;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;
}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:4px 0 4px;font-size:1.1rem}
.handle{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.actions{display:grid;gap:8px;margin-top:6px}
.lg{font-size:1.4rem;text-align:center;letter-spacing:.3em;font-weight:700}
.center{text-align:center}
.link{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:8px;font-size:.9rem}
.logline{border-bottom:1px solid var(--line);padding:9px 0;font-size:.85rem}
.logline:last-child{border-bottom:0}
.logline .w{color:var(--mut);font-size:.76rem}

/* ---------- v2: nav, business screens ---------- */
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button{font-size:.6rem;letter-spacing:.04em}
.backbtn{background:none;border:0;color:#fff;font-size:2rem;line-height:1;padding:0 8px 4px 0;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cream);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 4px;font-size:.84rem;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--cream2)}
.chev{color:var(--mut);font-size:1.4rem;line-height:1}
.gap{height:14px}
.big{font-size:1.25rem;font-weight:700;line-height:1.2}
.kicker{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.r{text-align:right}
.note{background:var(--cream2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.85rem;white-space:pre-line}
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qbtn{flex:1;min-width:64px;text-align:center;text-decoration:none;color:var(--green-d);background:var(--cream);border-radius:8px;padding:9px 6px;font-weight:600;font-size:.85rem}
.balbar{display:flex;justify-content:space-between}
.empty.sm{padding:12px;font-size:.85rem}
.pill.grey{background:#ECEDEF;color:#4A5058}
.pill.good{background:#DDEEE3;color:var(--green-d)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lines .line{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lines .line:first-child{padding-top:2px}
.lines .line.head .ttl{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d)}
.line.row{padding:8px 0;border-bottom:1px solid var(--line)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:.92rem;color:var(--mut)}
.trow span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.trow.big{font-weight:700;font-size:1.05rem;color:var(--ink);border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;margin:4px 0 8px}
.check input{width:20px;height:20px;padding:0}
.linkish{color:var(--green);font-weight:600;cursor:pointer}
.dangertext{color:var(--red)!important}
.btn.sm{padding:9px 8px}
a.btn{text-decoration:none}
.stat div b{font-size:1.25rem}
.docbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
body.indoc main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media (min-width:700px){ main{max-width:720px;margin:0 auto} }

/* ---------- v2.1: business switch + expenses ---------- */
body[data-biz=uribest]{--green:#1F4FB4;--green-d:#173C8C;--green-deep:#0F2A66}
body[data-biz=uribest] .ok{background:#E4EBF8;color:var(--green-d)}
body[data-biz=uribest] .pill.good{background:#E1E9F8;color:var(--green-d)}
body[data-biz=uribest] .seg,body[data-biz=uribest] .qbtn{background:#E9EEF7}
body[data-biz=uribest] input:focus,body[data-biz=uribest] select:focus,body[data-biz=uribest] textarea:focus{box-shadow:0 0 0 3px rgba(31,79,180,.18)}
.top{transition:background .2s}
.topword{display:inline-flex;align-items:center;height:30px;color:#fff}
.topword svg{height:15px;width:auto}
.biztog{display:flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px;flex:0 0 auto}
.biztog button{background:none;border:0;color:rgba(255,255,255,.85);font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:6px 10px;border-radius:16px;cursor:pointer}
.biztog button.on{background:#fff;color:var(--green-d)}
.top h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button{font-size:.56rem;letter-spacing:.02em;padding-left:1px;padding-right:1px}
.cats{padding:10px 14px}
.catrow{padding:6px 0;cursor:pointer;font-size:.88rem}
.catrow .bar{height:6px;background:var(--cream);border-radius:3px;margin-top:4px;overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--green);border-radius:3px;opacity:.75}
.catrow.on .bar i{opacity:1}
.catrow.on{font-weight:700}
.dhead{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px}
.clip{font-size:.85rem}
.receipt img{display:block;max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;cursor:zoom-in}
.receipt{margin-bottom:12px}
input.money{font-size:1.25rem;font-weight:700}
.scanstat{font-size:.84rem;background:var(--cream2);border-radius:8px;padding:8px 10px;margin-bottom:8px;color:var(--green-d)}
.scanstat.busy{color:var(--mut)}
.scanstat.busy::before{content:'';display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.trow.neg span:last-child{color:var(--red)}

/* ---------- v2.3: review, duplicates, accounts, P&L ---------- */
.hint{font-size:.78rem;color:var(--mut);margin-top:5px;min-height:1px}
.hint .link{padding:0;font-size:.78rem}
.dupwarn{background:#FBEFE6;border:1px solid #EFC9AE;color:#7A3B12;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.86rem}
.dupwarn b{display:block;margin-bottom:2px}
.dupwarn .btn{background:#fff}
.dupwarn.tap{cursor:pointer}
.catrow .bar i.cogs{background:var(--green)}
.catrow .bar i.expense{background:#B07D1A}
.legend{font-size:.72rem;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);vertical-align:-1px;margin-right:3px}
.legend i.expense{background:#B07D1A;margin-left:8px}
.stat .tap{cursor:pointer}
.rcol .pill{margin-top:2px}
.seg.two{grid-template-columns:1fr 1fr}
.pnl .psec{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green);margin:16px 0 4px}
.pnl .trow.tap{cursor:pointer}
.pnl .trow.tap:active{background:var(--cream2)}
.pnl .trow.sub1{border-top:1px solid var(--line);color:var(--ink);font-weight:600}
.pnl .trow.big{background:var(--green);color:#fff;border-radius:8px;padding:9px 10px;margin:10px -4px 0;border:0}
.pnl .trow.big span:last-child{color:#fff}
.pnl .trow.big.total.neg{background:var(--red)}
.pct{font-weight:500;opacity:.8;font-size:.85em;margin-left:4px}
.negtext{color:var(--red)}
.card.acting{border-color:var(--green);box-shadow:0 0 0 2px rgba(46,107,79,.15)}
/* v2.5: banks, checks */
.amt.pos{color:var(--green)}
.warntext{color:#9A5B12}
.matchbox{background:#EEF3EF;border:1px solid #CFE0D5;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
body[data-biz=uribest] .matchbox{background:#E9EEF7;border-color:#C9D5EE}
.matchbox>b{display:block;margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06);cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);font-size:.88rem;margin:0}
.mrow input{width:auto;margin:0}
.mrow .meta{display:inline}
label.check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--ink);margin:-4px 0 12px;font-weight:500}
label.check input{width:auto;margin:0}
.link.dep{padding:2px 0 0;font-size:.8rem}
.receipt.big img{max-height:46vh}
.rimg{position:relative}
.zoombtn{position:absolute;right:8px;bottom:16px;background:rgba(21,24,28,.72);color:#fff;border:0;border-radius:16px;padding:6px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
.viewer{position:fixed;inset:0;z-index:200;background:#0d0f12;display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.vbar span{flex:1;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
.vstage{flex:1;position:relative;overflow:hidden;touch-action:none}
#vImg{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center center;user-select:none;-webkit-user-drag:none;will-change:transform}
.vhint{text-align:center;font-size:.74rem;opacity:.6;padding:6px 0 calc(env(safe-area-inset-bottom) + 8px)}
/* v2.6: budgets */
.bbar{height:7px;background:var(--cream);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bbar i{display:block;height:100%;background:var(--green);border-radius:4px}
.bbar i.over{background:var(--red)}
.bvhead{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bvhead b{display:block;font-size:1.25rem}
.bvhead span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.bvhead div:last-child{text-align:right}
.bvrows{margin:10px 0 6px}
.bvrow{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.bvrow:active{background:var(--cream2)}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bline input{margin-bottom:6px}
.bline .bname{font-weight:600}
.achips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.achip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 9px;font-size:.72rem;color:var(--mut);cursor:pointer}
.achip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.achip.dim{opacity:.4}
.achip.more{border-style:dashed;color:var(--green);font-weight:600}
.bline .brm{padding:4px 0;font-size:.8rem}
.link.sm.codebtn{padding:2px 0;font-size:.74rem}
/* v2.6.1: some iPhones (installed app) leave a strip under bottom bars. --gap pushes them down to the real
   screen edge, and the white tail fills anything left so nothing shows through. */
:root{--gap:0px}
.tabs,.docbar,.sheet{bottom:calc(-1 * var(--gap))}
.tabs::after,.docbar::after{content:'';position:absolute;left:0;right:0;top:100%;height:240px;background:#fff}
/* sit the labels where iPhone's own tab bars do: just above the home bar, not a full inset higher */
/* The bars only land right when the page is at least as tall as the screen (Expenses always is), so make every page at least that tall. */
#app main,#auth main{min-height:calc(100vh + 2px)}
@supports (height:100lvh){#app main,#auth main{min-height:calc(100lvh + 2px)}}
.tabs{padding-bottom:max(6px, calc(env(safe-area-inset-bottom) - 14px))}
.tabs button{padding-bottom:5px}
.docbar{padding-bottom:max(10px, calc(env(safe-area-inset-bottom) - 8px))}
</style>
</head>
<body>

<div id="offline" class="banner warn hide">Offline — changes will send when you have signal</div>
<div id="queued" class="banner hide"></div>

<!-- ============================ SIGN IN ============================ -->
<section id="auth" class="hide">
  <div class="top"><img src="icons/icon-192.png" alt=""><h1>UFFG</h1></div>
  <main>
    <div id="authErr" class="err hide"></div>
    <div id="step1">
      <h2>Sign in</h2>
      <p class="sub">We'll email you a 6-digit code.</p>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="you@uffgconstruction.com">
      </div>
      <button class="btn wide" id="sendCode">Send code</button>
      <div class="center"><button class="link" id="haveCode">I already have a code</button></div>
    </div>
    <div id="step2" class="hide">
      <h2>Enter the code</h2>
      <p class="sub" id="sentTo"></p>
      <div class="field">
        <input id="code" class="lg" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      </div>
      <button class="btn wide" id="verify">Sign in</button>
      <div class="center"><button class="link" id="resend">Resend code</button>
      <button class="link" id="back">Use a different email</button></div>
    </div>
  </main>
</section>

<!-- ============================== APP ============================== -->
<section id="app" class="hide">
  <div class="top">
    <button class="backbtn hide" id="backBtn" aria-label="Back">‹</button>
    <img src="icons/icon-192.png" alt="" id="topLogo">

4C612 119 541 54 420 54H390C341 54 328 56 316 68C303 80 300 91 300 124V346H337C395 346 444 296 455 204H509V543H455C444 451 395 401 337 401H300V582C300 623 302 634 310 646C321 661 345 668 386 668H414C488 668 549 641 583 594C604 564 626 514 641 462H693L687 722H16V668H31C83 668 104 664 113 653C120 645 120 641 120 578V144C120 81 120 77 113 69C104 58 83 54 31 54H16V0H695Z"/><path transform="translate(3773.4,0)" d="M633 223C633 350 558 421 385 459L337 470C260 485 260 485 235 494C190 510 167 539 167 580C167 641 223 685 302 685C406 685 489 612 548 470H601L588 729H543L491 683C435 721 381 737 311 737C157 737 52 647 52 514C52 392 142 305 299 276L361 264C425 252 445 247 469 234C497 219 513 189 513 154C513 84 456 37 369 37C256 37 157 126 102 276H51L57 -7H102L164 52C225 6 289 -15 369 -15C525 -15 633 83 633 223Z"/><path transform="translate(4469.3,0)" d="M707 451 692 722H30L15 451H68C81 525 95 564 119 599C151 647 189 670 235 670C265 670 271 663 271 629V144C271 81 271 77 264 69C255 58 234 54 181 54H159V0H563V54H541C488 54 467 58 458 69C451 77 451 81 451 144V629C451 663 457 670 487 670C530 670 563 652 595 611C623 574 639 532 654 451Z"/></g></svg></span>

  <div class="vbar"><span id="vTitle"></span><button type="button" id="vRot" aria-label="Rotate">↻</button><button type="button" id="vFit">Fit</button><button type="button" id="vClose">Done</button></div>

</div>

<script src="config.js"></script>
<script>
/* ===================== tiny helpers ===================== */
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const APP_VERSION = '2.6.4';
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let TOKEN = LS.get('uffg.token', '');
let DATA  = LS.get('uffg.data', null);
let VIEW  = LS.get('uffg.tab', '');
let VIEWAS = '';
let QUEUE = LS.get('uffg.queue', []);
let FILTER = { q: '', loc: '', kind: '' };

/* ===================== server ===================== */
async function call(fn, args, opts) {
  opts = opts || {};
  args = args || {};
  if (VIEWAS && args.viewAs === undefined) args = Object.assign({}, args, { viewAs: VIEWAS });   // view & submit as
  const body = { fn, args, token: TOKEN, id: opts.id || '' };
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    // text/plain keeps Apps Script from demanding a CORS preflight
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const out = await res.json();
  if (!out.ok) {
    if (out.code === 'AUTH') { signOutLocal(); throw new Error('Please sign in again.'); }
    throw new Error(out.error || 'Something went wrong.');
  }
  return out.data;
}

/* Mutations go through the queue so a dead zone never loses a change. */
function enqueue(fn, args, label) {
  args = Object.assign({ viewAs: VIEWAS || '' }, args || {});        // remember who it was submitted as
  QUEUE.push({ id: uid(), fn, args, label, at: Date.now() });
  LS.set('uffg.queue', QUEUE);
  paintQueue();
  flush();
}

let flushing = false;
async function flush() {
  if (flushing || !navigator.onLine || !TOKEN || !QUEUE.length) return;
  flushing = true;
  try {
    while (QUEUE.length) {
      const job = QUEUE[0];
      try {
        await call(job.fn, job.args, { id: job.id });   // same id twice is ignored server-side
      } catch (e) {
        if (/sign in again/i.test(e.message)) break;
        // A rejected change (e.g. not enough stock) must not block the rest.
        toast(job.label + ': ' + e.message, true);
      }
      QUEUE.shift();
      LS.set('uffg.queue', QUEUE);
      paintQueue();
    }
    await refresh();
  } finally { flushing = false; }
}

function paintQueue() {
  const n = QUEUE.length, b = $('#queued');
  b.classList.toggle('hide', n === 0);
  if (n) b.textContent = n + (n === 1 ? ' change waiting to send' : ' changes waiting to send');
}

async function refresh() {
  if (!navigator.onLine) return;
  if (QUEUE.length && !flushing) { flush(); return; }   // send local changes first; flush refreshes after
  try {
    DATA = await call('bootstrap', VIEWAS ? { viewAs: VIEWAS } : {});
    LS.set('uffg.data', DATA);
    // Don't yank the page out from under someone mid-edit.
    if (route().view === 'doc' && DIRTY) { paintDocHead(); return; }
    const a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#view').contains(a)) return;
    render();
  } catch (e) { /* keep showing the cached copy */ }
}

/* ===================== sign in ===================== */
function showAuth() { $('#auth').classList.remove('hide'); $('#app').classList.add('hide'); }
function showApp()  { $('#auth').classList.add('hide'); $('#app').classList.remove('hide'); }

function authErr(m) {
  const e = $('#authErr');
  if (!m) return e.classList.add('hide');
  e.textContent = m; e.classList.remove('hide');
}

$('#sendCode').onclick = async () => {
  const email = $('#email').value.trim().toLowerCase();
  if (!email) return authErr('Enter your email.');
  authErr(''); $('#sendCode').disabled = true;
  try {
    await call('requestCode', { email });
    $('#sentTo').textContent = 'Sent to ' + email + '. It expires in 10 minutes.';
    $('#step1').classList.add('hide'); $('#step2').classList.remove('hide');
    $('#code').focus(); startResendTimer();
  } catch (e) { authErr(e.message); }
  $('#sendCode').disabled = false;
};

let resendT = 0;
function startResendTimer() {
  let left = 45; const b = $('#resend');
  clearInterval(resendT);
  const tick = () => {
    b.disabled = left > 0;
    b.textContent = left > 0 ? 'Resend in ' + left + 's' : 'Resend code';
    if (left-- <= 0) clearInterval(resendT);
  };
  tick(); resendT = setInterval(tick, 1000);
}
$('#resend').onclick = () => { $('#sendCode').click(); };
$('#haveCode').onclick = () => {
  const email = $('#email').value.trim().toLowerCase();
  if (!email) return authErr('Enter your email first.');
  authErr(''); $('#sentTo').textContent = 'Type the code for ' + email + '.';
  $('#step1').classList.add('hide'); $('#step2').classList.remove('hide'); $('#code').focus();
};
$('#back').onclick = () => { $('#step2').classList.add('hide'); $('#step1').classList.remove('hide'); authErr(''); };

$('#verify').onclick = async () => {
  const email = $('#email').value.trim().toLowerCase();
  const code = $('#code').value.trim();
  if (code.length !== 6) return authErr('Enter the 6 digits.');
  authErr(''); $('#verify').disabled = true;
  try {
    const r = await call('verifyCode', { email, code });
    TOKEN = r.token; LS.set('uffg.token', TOKEN);
    showApp(); await refresh();
  } catch (e) { authErr(e.message); }
  $('#verify').disabled = false;
};
$('#code').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) $('#verify').click();
});

function signOutLocal() {
  TOKEN = ''; DATA = null; VIEWAS = '';
  LS.del('uffg.token'); LS.del('uffg.data');
  showAuth();
}

/* ===================== sheet ===================== */
function openSheet(title, bodyNode) {
  const b = $('#sheetBody');
  b.innerHTML = '';
  if (title) b.appendChild(el('h3', null, esc(title)));
  b.appendChild(bodyNode);
  $('#scrim').onclick = closeSheet;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet() { $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet;

function toast(msg, bad) {
  const n = el('div', bad ? 'err' : 'ok', esc(msg));
  n.style.cssText = 'position:fixed;left:14px;right:14px;bottom:calc(var(--tabh) + 16px);z-index:80;margin:0';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3200);
}

/* ===================== derived ===================== */
const me     = () => (DATA && DATA.me) || { name: '', isManager: false, base: '' };
const acting = () => (DATA && DATA.acting) || me();
const locs   = () => (DATA && DATA.locations) || [];
const tools  = () => (DATA && DATA.tools) || [];
const parts  = () => (DATA && DATA.parts) || [];
const stock  = () => (DATA && DATA.stock) || [];

function totalOf(part) {
  return stock().filter(s => s.part.toLowerCase() === part.toLowerCase())
               .reduce((a, b) => a + b.qty, 0);
}
function byLoc(part) {
  return stock().filter(s => s.part.toLowerCase() === part.toLowerCase() && s.qty !== 0);
}
const lowParts = () => parts().filter(p => p.low > 0 && totalOf(p.part) <= p.low);

/* ===================== render / navigation ===================== */
/* Main tabs: customers · estimates · invoices · inventory · more.
   Detail pages (customer, doc, services, company) sit on a small stack so Back works. */
const ICONS = {
  customers: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/>',
  estimates: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/>',
  invoices:  '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M12 7v10M14.6 9.4c0-1.1-1.2-1.9-2.6-1.9s-2.6.8-2.6 1.9 1.2 1.6 2.6 1.9 2.6.9 2.6 2-1.2 1.9-2.6 1.9-2.6-.8-2.6-1.9"/>',
  expenses:  '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18M15.5 15h2.5"/><path d="M6 6l9-3 1.2 3"/>',
  inventory: '<path d="M3 9h18v11H3z"/><path d="M8 9V5.5h8V9M3 13.5h18"/>',
  more:      '<path d="M4 7h16M4 12h16M4 17h16"/>'
};
const TAB_LABEL = { customers: 'Customers', estimates: 'Estimates', invoices: 'Invoices', expenses: 'Expenses', inventory: 'Inventory', more: 'More' };
/* Money screens follow the person you're viewing as. Only a real manager can view as someone. */
const isMgr = () => !!(me().isManager && acting().isManager);
const allowedBiz = () => (DATA && DATA.biz && DATA.biz.businesses) || acting().businesses || ['uffg', 'uribest'];
const mainTabs = () => isMgr() ? ['customers', 'estimates', 'invoices', 'expenses', 'inventory', 'more'] : ['inventory', 'more'];

/* ---------- which business: UFFG or Uribest ---------- */
const BIZ_NAMES = { uffg: 'UFFG', uribest: 'Uribest' };
let BIZ = LS.get('uffg.biz', 'uffg');
function setBiz(k) {
  BIZ = k === 'uribest' ? 'uribest' : 'uffg';
  LS.set('uffg.biz', BIZ);
  document.body.dataset.biz = BIZ;
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = BIZ === 'uribest' ? '#1F4FB4' : '#2E6B4F';
}
setBiz(BIZ);
document.querySelectorAll('#bizTog button').forEach(b => b.onclick = () => {
  if (b.dataset.b === BIZ) return;
  setBiz(b.dataset.b);
  if (ROUTES.length) ROUTES = [];          // a customer/service page belongs to the other business
  FILTER = { q: '', loc: '', kind: '' };
  render(); window.scrollTo(0, 0);
});

let ROUTES = [];            // stack of {view, id}
const route = () => ROUTES[ROUTES.length - 1] || { view: VIEW };

function go(view, id) {      // open a detail page on top of the current tab
  ROUTES.push({ view, id });
  render(); window.scrollTo(0, 0);
}
function goTab(tab) {
  if (!leaveDocOk(() => goTab(tab))) return;
  VIEW = tab; ROUTES = []; LS.set('uffg.tab', tab);
  FILTER = { q: '', loc: '', kind: '' };
  render(); window.scrollTo(0, 0);
}
function back() {
  if (!leaveDocOk(back)) return;
  ROUTES.pop(); render(); window.scrollTo(0, 0);
}
$('#backBtn').onclick = back;

function paintTabs() {
  const tabs = mainTabs();
  if (tabs.indexOf(VIEW) < 0) VIEW = tabs[0];
  const nav = $('#tabs');
  nav.style.gridTemplateColumns = 'repeat(' + tabs.length + ',1fr)';
  nav.innerHTML = '';
  tabs.forEach(t => {
    const b = el('button', t === VIEW ? 'on' : '',
      '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[t] + '</svg>' + TAB_LABEL[t]);
    b.onclick = () => goTab(t);
    nav.appendChild(b);
  });
}

function render() {
  if (!DATA) return;
  if (allowedBiz().indexOf(BIZ) < 0) setBiz(allowedBiz()[0]);
  paintTabs();
  $('#who').innerHTML = esc(acting().name) + '<br>' + esc(acting().base || '');
  const a = $('#actingAs');
  if (VIEWAS && me().isManager) {
    a.classList.remove('hide');
    a.innerHTML = 'Viewing as <b>' + esc(acting().name) + '</b> — what you save is recorded as them. <button class="link" onclick="stopViewAs()">Stop</button>';
  } else a.classList.add('hide');

  const r = route();
  const detail = ROUTES.length > 0;
  $('#backBtn').classList.toggle('hide', !detail);
  $('#topLogo').classList.toggle('hide', detail || BIZ === 'uribest');
  $('#topWord').classList.toggle('hide', detail || BIZ !== 'uribest');
  const allowed = allowedBiz();
  if (allowed.indexOf(BIZ) < 0) setBiz(allowed[0]);
  const showTog = isMgr() && allowed.length > 1 && !(r.view === 'inventory' || r.view === 'doc');
  $('#bizTog').classList.toggle('hide', !showTog);
  $('#who').classList.toggle('hide', showTog);
  document.querySelectorAll('#bizTog button').forEach(b => b.classList.toggle('on', b.dataset.b === BIZ));
  const isDoc = r.view === 'doc';
  $('#tabs').classList.toggle('hide', isDoc);
  $('#docbar').classList.toggle('hide', !isDoc);
  document.body.classList.toggle('indoc', isDoc);

  const v = $('#view'); v.innerHTML = '';
  const wrap = el('div'); v.appendChild(wrap);
  const views = {
    customers: vCustomers, estimates: v => vDocList(v, 'estimate'), invoices: v => vDocList(v, 'invoice'), expenses: vExpenses,
    inventory: vInventory, more: vMore,
    customer: vCustomer, doc: vDoc, services: vServices, company: vCompany, pnl: vPnl,
    banks: vBanks, bank: vBank, vendors: vVendors, balance: vBalance, budget: vBudget, budgets: vBudgets
  };
  const titles = { customer: 'Customer', services: 'Services & pricing', company: 'Company info', pnl: 'Profit & loss',
    banks: 'Bank & cards', bank: (bankById(r.id) || {}).name || 'Account', vendors: 'Vendors & subs', balance: 'Balance sheet', budget: 'Job budget', budgets: 'Job budgets' };
  $('#viewTitle').textContent = (r.view === 'doc' ? docLabel(EDIT) : (titles[r.view] || TAB_LABEL[r.view] || r.view)).toUpperCase();
  (views[r.view] || vInventory)(wrap, r.id);
}

/* ---------- inventory (overview / tools / parts under one tab) ---------- */
let INV = LS.get('uffg.inv', 'overview');
function vInventory(v) {
  const seg = el('div', 'seg');
  [['overview', 'Overview'], ['tools', 'Tools'], ['parts', 'Parts']].forEach(([k, lab]) => {
    const b = el('button', INV === k ? 'on' : '', lab);
    b.onclick = () => { INV = k; LS.set('uffg.inv', k); FILTER = { q: '', loc: '', kind: '' }; render(); };
    seg.appendChild(b);
  });
  v.appendChild(seg);
  ({ overview: vOverview, tools: vTools, parts: vParts })[INV](v);
}

/* ---------- overview ---------- */
function vOverview(v) {
  const out = tools().filter(t => t.by);
  const rep = tools().filter(t => t.status === 'Needs repair' || t.status === 'Lost');
  const nol = tools().filter(t => !t.location);
  const low = lowParts();

  const s = el('div', 'stat');
  s.innerHTML =
    `<div class="${low.length ? 'alert' : ''}"><b>${low.length}</b><span>Low on stock</span></div>
     <div><b>${out.length}</b><span>Checked out</span></div>
     <div class="${rep.length ? 'alert' : ''}"><b>${rep.length}</b><span>Repair / lost</span></div>
     <div><b>${tools().length}</b><span>Tools total</span></div>`;
  v.appendChild(s);

  section(v, 'Low on stock', low.map(p => ({
    ttl: p.part, meta: totalOf(p.part) + ' ' + p.unit + ' left · target ' + p.low,
    pill: 'Low', cls: 'bad', onclick: () => partSheet(p)
  })), 'Nothing is low.');

  section(v, 'Checked out', out.map(t => ({
    ttl: t.name, meta: t.by + ' · ' + t.location, pill: t.id, cls: 'out',
    onclick: () => toolSheet(t)
  })), 'Nothing is checked out.');

  section(v, 'Needs repair or lost', rep.map(t => ({
    ttl: t.name, meta: (t.location || 'No location') + (t.notes ? ' · ' + t.notes : ''),
    pill: t.status, cls: 'bad', onclick: () => toolSheet(t)
  })), 'Everything is in good shape.');

  if (nol.length) section(v, 'No location set', nol.map(t => ({
    ttl: t.name, meta: t.id, pill: '?', cls: 'warn', onclick: () => toolSheet(t)
  })), '');
}

function section(v, title, items, emptyMsg) {
  if (!items.length && !emptyMsg) return;
  v.appendChild(el('h2', null, esc(title)));
  if (!items.length) { v.appendChild(el('div', 'empty', esc(emptyMsg))); return; }
  items.forEach(i => {
    const c = el('div', 'card');
    c.innerHTML = `<div class="row"><div class="grow">
        <div class="ttl">${esc(i.ttl)}</div><div class="meta">${esc(i.meta)}</div>
      </div><span class="pill ${i.cls || ''}">${esc(i.pill)}</span></div>`;
    c.onclick = i.onclick;
    v.appendChild(c);
  });
}

/* ---------- tools ---------- */
function vTools(v) {
  const search = el('div', 'search');
  search.innerHTML = `<input id="q" type="search" placeholder="Search tools" value="${esc(FILTER.q)}">`;
  v.appendChild(search);
  search.querySelector('input').oninput = e => { FILTER.q = e.target.value; redrawList(); };

  const chips = el('div', 'chips');
  const opts = [['', 'All places']].concat(locs().map(l => [l.name, l.name]));
  opts.forEach(([val, lab]) => {
    const b = el('button', FILTER.loc === val ? 'on' : '', esc(lab));
    b.onclick = () => { FILTER.loc = val; render(); };
    chips.appendChild(b);
  });
  v.appendChild(chips);

  if (me().isManager || true) {
    const add = el('button', 'btn ghost wide', '+ Add a tool');
    add.style.marginBottom = '12px';
    add.onclick = addToolSheet;
    v.appendChild(add);
  }

  const list = el('div'); list.id = 'list'; v.appendChild(list);
  redrawList();
}

function redrawList() {
  const list = $('#list'); if (!list) return;
  const q = FILTER.q.toLowerCase();
  const items = tools().filter(t =>
    (!FILTER.loc || t.location === FILTER.loc) &&
    (!q || (t.name + ' ' + t.brand + ' ' + t.model + ' ' + t.id).toLowerCase().includes(q))
  );
  list.innerHTML = '';
  if (!items.length) { list.appendChild(el('div', 'empty', 'No tools match.')); return; }
  items.forEach(t => {
    const bad = t.status !== 'Good';
    const c = el('div', 'card');
    c.innerHTML = `<div class="row"><div class="grow">
        <div class="ttl">${esc(t.name)}</div>
        <div class="meta">${esc([t.brand, t.model, t.id].filter(Boolean).join(' · '))}</div>
        <div class="meta">${esc(t.location || 'No location')}${t.by ? ' · ' + esc(t.by) : ''}</div>

/* ===================== business: data ===================== */
function biz() {
  const empty = () => ({ company: {}, customers: [], services: [], docs: [], payments: [] });
  if (!DATA) return empty();
  if (!DATA.biz) DATA.biz = empty();
  return DATA.biz;
}
/* Company info for a business. Older cached data had one flat object = UFFG. */
function companyOf(k) {
  const c = biz().company || {};
  if (c.uffg || c.uribest) return c[k] || {};
  return k === 'uffg' ? c : {};
}
const company = () => companyOf(BIZ);
const inBiz = x => (x.business || 'uffg') === BIZ;
const custs = () => biz().customers.filter(inBiz);
const svcs = () => biz().services.filter(inBiz);
const expensesAll = () => (biz().expenses || []);
const expenses = () => expensesAll().filter(inBiz);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => (r2(n) < 0 ? '-$' : '$') + Math.abs(r2(n)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const clone = o => JSON.parse(JSON.stringify(o));
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(ymd, n) {
  const p = (ymd || today()).split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2] + (Number(n) || 0));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(ymd) {
  if (!ymd) return '';
  const p = String(ymd).slice(0, 10).split('-').map(Number);
  if (p.length < 3 || !p[0]) return String(ymd);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtQty(q) { q = Number(q) || 0; return String(Math.round(q * 1000) / 1000); }

/* Same math as the server: discount off the subtotal, tax on taxable lines only. */
function totals(d) {
  let sub = 0, taxable = 0;
  (d.lines || []).forEach(l => { if (l.heading) return; const a = r2((Number(l.qty) || 0) * (Number(l.rate) || 0)); sub += a; if (l.taxable) taxable += a; });
  sub = r2(sub);
  const disc = Math.min(Math.max(0, r2(d.discount)), sub);
  const tax = r2((sub ? taxable * (1 - disc / sub) : 0) * (Number(d.taxRate) || 0) / 100);
  return { subtotal: sub, discount: disc, tax, total: r2(sub - disc + tax) };
}

const customerById = id => biz().customers.find(c => c.id === id);
const custName = id => { const c = customerById(id); return c ? c.name : 'No customer'; };
const docById = id => biz().docs.find(d => d.id === id);
const docsOf = type => biz().docs.filter(d => d.type === type && inBiz(d));
const changeOrdersOf = estId => biz().docs.filter(d => d.type === 'change' && d.parent === estId)
  .sort((a, b) => a.number.localeCompare(b.number, undefined, { numeric: true }));
const paymentsOf = invId => biz().payments.filter(p => p.invoice === invId);
const TYPE_LABEL = { estimate: 'Estimate', invoice: 'Invoice', change: 'Change order' };
function docLabel(d) { return d ? (TYPE_LABEL[d.type] || 'Document') + (d.number ? ' ' + d.number : '') : ''; }
function balance(inv) { return r2(totals(inv).total - (Number(inv.paid) || 0)); }
function isOverdue(inv) { return inv.type === 'invoice' && (inv.status === 'Sent' || inv.status === 'Partial') && inv.due && inv.due < today(); }
function shownStatus(d) { return isOverdue(d) ? 'Overdue' : (d.status || 'Draft'); }
function pillClass(st) {
  return ({ Draft: 'grey', Sent: 'out', Approved: 'good', Paid: 'good', Partial: 'warn', Declined: 'bad', Void: 'bad', Overdue: 'bad' })[st] || '';
}
function custBalance(cid) {
  return r2(docsOf('invoice').filter(d => d.customer === cid && d.status !== 'Void' && d.status !== 'Draft')
    .reduce((s, d) => s + balance(d), 0));
}
/* Contract value of an estimate = estimate total + its approved change orders. */
function contractTotal(est) {
  return r2(totals(est).total + changeOrdersOf(est.id).filter(c => c.status === 'Approved').reduce((s, c) => s + totals(c).total, 0));
}
function upsertLocal(list, obj) {
  const i = list.findIndex(x => x.id === obj.id);
  if (i >= 0) list[i] = obj; else list.unshift(obj);
}
function saveLocal() { LS.set('uffg.data', DATA); }

        ${bal > 0 ? `<span class="pill warn">${money(bal)} due</span>` : '<span class="chev">›</span>'}</div>`, () => go('customer', c.id)));
    });
  }
  paint();
}

function customerSheet(c, after) {
  const isNew = !c;
  c = c ? clone(c) : { id: uid(), business: BIZ, name: '', company: '', phone: '', email: '', address: '', notes: '' };
  const b = el('div');
  b.innerHTML =
    field('Name', `<input id="cn" value="${esc(c.name)}" placeholder="Jane Smith" autocomplete="off">`) +
    field('Company (optional)', `<input id="cco" value="${esc(c.company)}">`) +
    `<div class="grid2">` +
    field('Phone', `<input id="cph" type="tel" inputmode="tel" value="${esc(c.phone)}">`) +
    field('Email', `<input id="cem" type="email" inputmode="email" autocapitalize="off" value="${esc(c.email)}">`) +
    `</div>` +
    field('Address / job site', `<textarea id="cad" rows="2">${esc(c.address)}</textarea>`) +
    field('Notes', `<textarea id="cnt" rows="2">${esc(c.notes)}</textarea>`);
  const acts = el('div', 'actions');
  acts.appendChild(btn(isNew ? 'Add customer' : 'Save', () => {
    c.name = $('#cn').value.trim(); if (!c.name) return toast('Give the customer a name.', true);
    c.company = $('#cco').value.trim(); c.phone = $('#cph').value.trim(); c.email = $('#cem').value.trim();
    c.address = $('#cad').value.trim(); c.notes = $('#cnt').value.trim();
    upsertLocal(biz().customers, c); saveLocal();
    enqueue('saveCustomer', c, c.name);
    closeSheet();
    if (after) after(c); else render();
  }));
  if (!isNew) acts.appendChild(btn('Archive customer', () => confirmSheet('Archive ' + c.name + '?',
    'They disappear from lists. Their estimates and invoices stay.', 'Archive', () => {
      DATA.biz.customers = biz().customers.filter(x => x.id !== c.id); saveLocal();
      enqueue('archiveCustomer', { id: c.id }, c.name);
      ROUTES = []; render();
    }, true), 'ghost'));
  b.appendChild(acts);
  openSheet(isNew ? 'New customer' : 'Edit customer', b);
  setTimeout(() => { const n = $('#cn'); if (n && isNew) n.focus(); }, 250);
}

function vCustomer(v, id) {

      <button class="btn sm ghost" id="editC">Edit</button></div>

    ${c.phone || c.email ? `<div class="meta">${esc([c.phone, c.email].filter(Boolean).join(' · '))}</div>` : ''}
    ${c.notes ? `<div class="note">${esc(c.notes)}</div>` : ''}
    <div class="quick">

  g.appendChild(btn('+ Invoice', () => openNewDoc('invoice', c.id), 'ghost'));
  v.appendChild(g);
  if (bal > 0) v.appendChild(el('div', 'ok balbar', `Balance due <b>${money(bal)}</b>`));

function customerPicker(onpick) {
  const b = el('div');
  b.innerHTML = `<div class="search"><input id="cpq" type="search" placeholder="Search customers" autocomplete="off"></div><div id="cpl"></div>`;
  const add = btn('+ New customer', () => customerSheet(null, c => onpick(c)), 'ghost');

  openSheet('Pick a customer', b);

    const q = $('#cpq').value.toLowerCase(), l = $('#cpl'); l.innerHTML = '';

      .forEach(c => l.appendChild(card(`<div class="ttl">${esc(c.name)}</div><div class="meta">${esc([c.company, c.phone].filter(Boolean).join(' · '))}</div>`,

/* ===================== estimate / invoice lists ===================== */
const byNewest = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || '').localeCompare(a.created || '');

function docCard(d) {
  const st = shownStatus(d);
  const right = d.type === 'invoice' && (st === 'Partial' || st === 'Sent' || st === 'Overdue')
    ? `<div class="amt">${money(balance(d))}</div><div class="meta r">due</div>` : `<div class="amt">${money(totals(d).total)}</div>`;
  const cos = d.type === 'estimate' ? changeOrdersOf(d.id).length : 0;
  return card(`<div class="row"><div class="grow">
      <div class="ttl">${esc(custName(d.customer))}</div>
      <div class="meta">${esc([d.number || 'New', d.title].filter(Boolean).join(' · '))}</div>
      <div class="meta">${esc(fmtDate(d.date))}${d.type === 'invoice' && d.due ? ' · due ' + esc(fmtDate(d.due)) : ''}${cos ? ' · ' + cos + ' change order' + (cos > 1 ? 's' : '') : ''}</div>
    </div><div class="rcol">${right}${pill(st)}</div></div>`, () => openDoc(d.id));
}

function vDocList(v, type) {
  const isEst = type === 'estimate';
  const all = docsOf(type);
  // summary tiles
  const s = el('div', 'stat');
  if (isEst) {
    const open = all.filter(d => d.status === 'Draft' || d.status === 'Sent');
    const won = all.filter(d => d.status === 'Approved');
    s.innerHTML = `<div><b>${money(open.reduce((a, d) => a + totals(d).total, 0))}</b><span>${open.length} open</span></div>
      <div><b>${money(won.reduce((a, d) => a + contractTotal(d), 0))}</b><span>${won.length} approved</span></div>`;
  } else {
    const unpaid = all.filter(d => ['Sent', 'Partial'].includes(d.status));
    const late = unpaid.filter(isOverdue);
    s.innerHTML = `<div><b>${money(unpaid.reduce((a, d) => a + balance(d), 0))}</b><span>${unpaid.length} unpaid</span></div>
      <div class="${late.length ? 'alert' : ''}"><b>${money(late.reduce((a, d) => a + balance(d), 0))}</b><span>${late.length} overdue</span></div>`;
  }
  v.appendChild(s);
  const add = btn('+ New ' + (isEst ? 'estimate' : 'invoice'), () => customerPicker(c => openNewDoc(type, c.id)));
  add.classList.add('wide'); add.style.marginBottom = '10px';
  v.appendChild(add);
  searchBox(v, 'Search ' + (isEst ? 'estimates' : 'invoices'), FILTER.q, q => { FILTER.q = q; paint(); });
  const opts = isEst ? [['', 'All'], ['Draft', 'Draft'], ['Sent', 'Sent'], ['Approved', 'Approved'], ['Declined', 'Declined']]
                     : [['', 'All'], ['unpaid', 'Unpaid'], ['Overdue', 'Overdue'], ['Paid', 'Paid'], ['Draft', 'Draft'], ['Void', 'Void']];
  chipRow(v, opts, FILTER.kind, k => { FILTER.kind = k; render(); });
  const list = el('div'); v.appendChild(list);
  function paint() {
    const q = FILTER.q.toLowerCase(), k = FILTER.kind;
    const items = all.filter(d => {
      const st = shownStatus(d);
      if (k === 'unpaid' && !['Sent', 'Partial', 'Overdue'].includes(st)) return false;
      if (k && k !== 'unpaid' && st !== k) return false;
      return !q || [d.number, d.title, custName(d.customer), d.site].join(' ').toLowerCase().includes(q);
    }).sort(byNewest);
    list.innerHTML = '';
    if (!items.length) list.appendChild(el('div', 'empty', all.length ? 'Nothing matches.' : 'No ' + (isEst ? 'estimates' : 'invoices') + ' yet.'));
    items.forEach(d => list.appendChild(docCard(d)));
  }
  paint();
}

/* ===================== document editor ===================== */
let EDIT = null, DIRTY = false;

function newDoc(type, customerId, parent) {
  const co = company(), c = customerById(customerId) || {};
  const d = {
    id: uid(), business: BIZ, type, number: '', customer: customerId, title: '', site: (c.address || '').replace(/\s*\n\s*/g, ', '), status: 'Draft',
    date: today(), due: '', parent: parent || '', lines: [], taxRate: Number(co.taxRate) || 0, discount: 0, deposit: 0,
    notes: '', terms: '', paid: 0, billed: '', created: new Date().toISOString(), _new: true
  };
  if (type === 'estimate') { d.due = addDays(d.date, co.estimateDays || 30); d.terms = co.estimateTerms || ''; }
  if (type === 'invoice') { d.due = addDays(d.date, co.invoiceDays || 0); d.terms = co.invoiceTerms || ''; }
  if (type === 'change') { d.terms = co.changeTerms || ''; }
  return d;
}
function openNewDoc(type, customerId, parent) {
  EDIT = newDoc(type, customerId, parent); DIRTY = true;
  if (parent) { const p = docById(parent); if (p) { EDIT.taxRate = p.taxRate; EDIT.site = p.site; } }
  go('doc', EDIT.id);
}
function openDoc(id) {
  const d = docById(id); if (!d) return toast('Not found.', true);
  if ((d.business || 'uffg') !== BIZ) setBiz(d.business);
  EDIT = clone(d); DIRTY = false;
  go('doc', id);
}

/* Leaving a page with unsaved edits asks first. Returns true if it's fine to leave now. */
function leaveDocOk(retry) {
  if (route().view === 'budget' && BDIRTY) {
    const b = el('div');
    b.innerHTML = `<p class="sub" style="margin:6px 0 14px">This budget has changes that aren't saved.</p>`;
    const acts = el('div', 'actions');
    acts.appendChild(btn('Save budget', () => { closeSheet(); saveBudget(retry); }));
    acts.appendChild(btn('Discard changes', () => { closeSheet(); BDIRTY = false; BEDIT = null; retry(); }, 'ghost'));
    acts.appendChild(btn('Keep editing', closeSheet, 'ghost'));
    b.appendChild(acts); openSheet('Save budget?', b);
    return false;
  }
  if (route().view !== 'doc' || !DIRTY) return true;
  const b = el('div');
  b.innerHTML = `<p class="sub" style="margin:6px 0 14px">You have changes that aren't saved.</p>`;
  const acts = el('div', 'actions');
  acts.appendChild(btn('Save', () => { closeSheet(); saveEdit(); retry(); }));
  acts.appendChild(btn('Discard changes', () => { closeSheet(); DIRTY = false; retry(); }, 'ghost'));
  acts.appendChild(btn('Keep editing', closeSheet, 'ghost'));
  b.appendChild(acts);
  openSheet('Save changes?', b);
  return false;
}

function saveEdit(silent) {
  if (!EDIT) return;
  if (!EDIT.customer) return toast('Pick a customer first.', true);
  const t = totals(EDIT);
  Object.assign(EDIT, t);
  const billFrom = EDIT._billFrom;
  const stored = clone(EDIT); delete stored._new; delete stored._billFrom;
  const prevDoc = docById(EDIT.id); if (prevDoc && prevDoc.budget) stored.budget = prevDoc.budget;   // the budget is edited on its own page
  upsertLocal(biz().docs, stored);
  (billFrom || []).forEach(id => { const s = docById(id); if (s) s.billed = EDIT.id; });
  saveLocal();
  const payload = { doc: stored }; if (billFrom) payload.billFrom = billFrom;
  enqueue('saveDoc', payload, docLabel(EDIT) || TYPE_LABEL[EDIT.type]);
  delete EDIT._new; delete EDIT._billFrom;
  DIRTY = false;
  if (!silent) { toast('Saved'); paintDocBar(); paintDocHead(); }
}

function setStatus(st) {
  if (DIRTY || EDIT._new) saveEdit(true);
  EDIT.status = st;
  const d = docById(EDIT.id); if (d) d.status = st;
  if (st === 'Approved') EDIT.approvedAt = new Date().toISOString();
  saveLocal();
  enqueue('setDocStatus', { id: EDIT.id, status: st }, docLabel(EDIT));
  toast(docLabel(EDIT) + ' marked ' + st.toLowerCase());
  render();
}

function vDoc(v, id) {
  if (!EDIT || EDIT.id !== id) { const d = docById(id); if (!d) { v.appendChild(el('div', 'empty', 'Not found.')); return; } EDIT = clone(d); DIRTY = false; }
  else if (!DIRTY && !EDIT._new) { const d = docById(id); if (d) EDIT = clone(d); }
  const d = EDIT, c = customerById(d.customer) || { name: 'Pick a customer' };
  const isInv = d.type === 'invoice', isEst = d.type === 'estimate', isCO = d.type === 'change';
  const parent = isCO ? docById(d.parent) : null;

  // ---- header
  const head = el('div', 'card'); head.id = 'docHead';
  v.appendChild(head);
  const cust = card(`<div class="row"><div class="grow"><label>${isInv ? 'Bill to' : 'Customer'}</label>
      <div class="ttl">${esc(c.name)}</div><div class="meta">${esc([c.phone, c.email].filter(Boolean).join(' · '))}</div></div><span class="chev">›</span></div>`,
    () => { if (isCO) return toast('A change order stays with its estimate’s customer.'); customerPicker(nc => { EDIT.customer = nc.id; if (!EDIT.site) EDIT.site = (nc.address || '').replace(/\s*\n\s*/g, ', '); DIRTY = true; render(); }); });
  v.appendChild(cust);
  if (parent) v.appendChild(card(`<div class="meta">Change to <b>${esc(parent.number)}</b>${parent.title ? ' · ' + esc(parent.title) : ''}</div>
      <div class="meta">Original estimate ${money(totals(parent).total)} · contract now ${money(contractTotal(parent))}</div>`, () => openDocFromDoc(parent.id)));

  const f = el('div', 'card');
  f.innerHTML =
    field(isCO ? 'What changed' : 'Job name', `<input data-f="title" value="${esc(d.title)}" placeholder="${isCO ? 'Add 2 extra posts' : 'Backyard carport 20x20'}">`) +
    field('Job site address', `<input data-f="site" value="${esc(d.site)}" placeholder="${esc(c.address || 'Same as customer')}">`) +
    `<div class="grid2">` + field('Date', `<input type="date" data-f="date" value="${esc(d.date)}">`) +
    (isCO ? '' : field(isInv ? 'Due date' : 'Valid until', `<input type="date" data-f="due" value="${esc(d.due)}">`)) + `</div>`;
  v.appendChild(f);

  // ---- line items
  v.appendChild(el('h2', null, 'Line items'));
  const li = el('div', 'card lines');
  if (!d.lines.length) li.appendChild(el('div', 'empty sm', 'No items yet. Add a service or a custom item.'));
  d.lines.forEach((l, i) => {
    const row = el('div', 'line' + (l.heading ? ' head' : ''));
    row.innerHTML = l.heading ? `<div class="ttl">${esc(l.name)}</div>` :
      `<div class="row"><div class="grow"><div class="ttl">${esc(l.name || '(no name)')}</div>
        ${l.desc ? `<div class="meta clamp">${esc(l.desc)}</div>` : ''}
        <div class="meta">${fmtQty(l.qty)}${l.unit ? ' ' + esc(l.unit) : ''} × ${money(l.rate)}${l.taxable ? ' · taxable' : ''}</div></div>
        <div class="amt">${money(r2(l.qty * l.rate))}</div></div>`;
    row.onclick = () => lineSheet(i);
    li.appendChild(row);
  });
  const addRow = el('div', 'grid2'); addRow.style.marginTop = '10px';
  addRow.appendChild(btn('+ Add item', addItemSheet));
  addRow.appendChild(btn('+ Section heading', () => { EDIT.lines.push({ heading: true, name: '' }); DIRTY = true; lineSheet(EDIT.lines.length - 1, true); }, 'ghost'));
  li.appendChild(addRow);
  v.appendChild(li);

  // ---- totals
  const tc = el('div', 'card'); tc.id = 'totals'; v.appendChild(tc);
  const tf = el('div', 'grid3');
  tf.innerHTML = field('Discount $', `<input data-f="discount" inputmode="decimal" type="number" step="0.01" min="0" value="${d.discount || ''}" placeholder="0">`) +
    field('Tax rate %', `<input data-f="taxRate" inputmode="decimal" type="number" step="0.001" min="0" value="${d.taxRate || ''}" placeholder="0">`) +
    (isEst ? field('Deposit %', `<input data-f="deposit" inputmode="decimal" type="number" step="1" min="0" max="100" value="${d.deposit || ''}" placeholder="0">`) : '<div></div>');
  v.appendChild(tf);

  // ---- payments (invoice)
  if (isInv && !d._new) {
    v.appendChild(el('h2', null, 'Payments'));
    const pc = el('div', 'card');
    const pays = paymentsOf(d.id);
    if (!pays.length) pc.appendChild(el('div', 'meta', 'No payments recorded.'));
    pays.forEach(p => {
      const r = el('div', 'row line');
      r.innerHTML = `<div class="grow"><div class="ttl">${money(p.amount)}</div><div class="meta">${esc([fmtDate(p.date), p.method, p.note].filter(Boolean).join(' · '))}</div>
        ${banksOf().length ? `<button class="link dep">${esc(p.bank ? 'Deposited to ' + bankLabel(bankById(p.bank)) : 'Not deposited yet')} ›</button>` : ''}</div><button class="link rm">Remove</button>`;
      if (r.querySelector('.dep')) r.querySelector('.dep').onclick = () => {
        const f = el('div'); f.innerHTML = field('Deposited to', `<select id="pdb">${bankOptions(p.bank, 'Not deposited yet / cash on hand')}</select>`);
        f.appendChild(btn('Save', () => { p.bank = $('#pdb').value; saveLocal(); enqueue('setPaymentBank', { id: p.id, bank: p.bank }, 'Deposit'); closeSheet(); render(); }));
        openSheet('Payment ' + money(p.amount), f);
      };
      r.querySelector('.rm').onclick = () => confirmSheet('Remove payment?', money(p.amount) + ' on ' + fmtDate(p.date), 'Remove', () => {
        DATA.biz.payments = biz().payments.filter(x => x.id !== p.id);
        localPaid(d.id); saveLocal();
        enqueue('deletePayment', { id: p.id }, 'Payment'); render();
      }, true);
      pc.appendChild(r);
    });
    if (d.status !== 'Void') { const rp = btn('Record payment', paymentSheet, 'ghost'); rp.classList.add('wide'); rp.style.marginTop = '10px'; pc.appendChild(rp); }
    v.appendChild(pc);
  }

  // ---- change orders (estimate)
  if (isEst && !d._new) {
    v.appendChild(el('h2', null, 'Change orders'));
    const cos = changeOrdersOf(d.id);
    if (!cos.length) v.appendChild(el('div', 'meta', d.status === 'Approved' ? 'None yet.' : 'Available once the estimate is approved.'));
    cos.forEach(co => v.appendChild(card(`<div class="row"><div class="grow"><div class="ttl">${esc(co.number || 'New')}</div>
        <div class="meta">${esc(co.title || '')}${co.billed ? ' · billed' : ''}</div></div>
        <div class="rcol"><div class="amt">${money(totals(co).total)}</div>${pill(co.status)}</div></div>`, () => openDocFromDoc(co.id))));
    if (cos.length) v.appendChild(el('div', 'meta r', 'Contract total with approved changes: <b>' + money(contractTotal(d)) + '</b>'));
    if (d.status === 'Approved') { const nb = btn('+ New change order', newChangeOrder, 'ghost'); nb.classList.add('wide'); nb.style.marginTop = '8px'; v.appendChild(nb); }
  }

  // ---- job costs (saved estimates and invoices)
  if (!d._new && d.type !== 'change') jobCostsSection(v, d);

  // ---- notes & terms
  v.appendChild(el('h2', null, 'Notes'));
  const nt = el('div', 'card');
  nt.innerHTML = field('Message to customer', `<textarea data-f="notes" rows="3" placeholder="Shows on the PDF">${esc(d.notes)}</textarea>`) +
    field('Terms', `<textarea data-f="terms" rows="3">${esc(d.terms)}</textarea>`);
  v.appendChild(nt);
  v.appendChild(el('div', 'gap'));

  // one listener for every field on the page
  v.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.f; if (!k) return;
    EDIT[k] = ['discount', 'taxRate', 'deposit'].includes(k) ? (Number(e.target.value) || 0) : e.target.value;
    DIRTY = true; paintTotals(); paintDocBar();
  });
  paintDocHead(); paintTotals(); paintDocBar();
}

function openDocFromDoc(id) {
  if (!leaveDocOk(() => openDocFromDoc(id))) return;
  const d = docById(id); if (!d) return;
  if ((d.business || 'uffg') !== BIZ) setBiz(d.business);
  EDIT = clone(d); DIRTY = false; go('doc', id);
}

function paintDocHead() {
  const h = $('#docHead'); if (!h || !EDIT) return;
  const d = EDIT.id ? (DIRTY ? EDIT : (docById(EDIT.id) || EDIT)) : EDIT;
  if (!DIRTY && d !== EDIT) { EDIT.number = d.number; EDIT.status = d.status; }
  h.innerHTML = `<div class="row"><div class="grow"><div class="kicker">${esc(BIZ_NAMES[EDIT.business || 'uffg'] + ' · ' + TYPE_LABEL[EDIT.type])}</div>
    <div class="big">${esc(EDIT.number || (EDIT._new ? 'New' : 'Saving…'))}</div></div>${pill(shownStatus(EDIT))}</div>
    ${EDIT.billed ? `<div class="meta">Billed on ${esc((docById(EDIT.billed) || {}).number || 'an invoice')}</div>` : ''}`;
  if (EDIT.billed) { const m = h.querySelector('.meta:last-child'); m.classList.add('linkish'); m.onclick = () => openDocFromDoc(EDIT.billed); }
  $('#viewTitle').textContent = docLabel(EDIT).toUpperCase();
}

function paintTotals() {
  const tc = $('#totals'); if (!tc) return;
  const d = EDIT, t = totals(d), rows = [];
  rows.push(['Subtotal', money(t.subtotal)]);
  if (t.discount) rows.push(['Discount', '-' + money(t.discount)]);
  if (t.tax) rows.push(['Tax (' + d.taxRate + '%)', money(t.tax)]);
  rows.push(['Total', money(t.total), 'big']);
  if (d.type === 'estimate' && Number(d.deposit)) rows.push(['Deposit (' + d.deposit + '%)', money(r2(t.total * d.deposit / 100))]);
  if (d.type === 'invoice' && !d._new) {
    rows.push(['Paid', '-' + money(d.paid || 0)]);
    rows.push(['Balance due', money(r2(t.total - (d.paid || 0))), 'big']);
  }
  tc.innerHTML = rows.map(r => `<div class="trow ${r[2] || ''}"><span>${esc(r[0])}</span><span>${r[1]}</span></div>`).join('');
}

function paintDocBar() {
  const bar = $('#docbar'); if (!bar || !EDIT) return;
  bar.innerHTML = '';
  const s = btn(DIRTY ? 'Save' : 'Saved', () => saveEdit(), DIRTY ? '' : 'ghost');
  if (!DIRTY) s.disabled = true;
  bar.appendChild(s);
  bar.appendChild(btn('PDF', pdfSheet, 'ghost'));
  bar.appendChild(btn('More', actionsSheet, 'ghost'));
}

/* ---- line items ---- */
function addItemSheet() {

  const custom = btn('+ Custom item', () => { closeSheet(); EDIT.lines.push({ name: '', desc: '', qty: 1, unit: '', rate: 0, taxable: false }); DIRTY = true; lineSheet(EDIT.lines.length - 1, true); }, 'ghost');
  custom.classList.add('wide'); custom.style.marginTop = '8px';
  b.appendChild(custom);
  openSheet('Add item', b);
  const paint = () => {
    const q = $('#svq').value.toLowerCase(), l = $('#svl'); l.innerHTML = '';
    const list = svcs().filter(s => !q || (s.name + ' ' + s.description).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    if (!svcs().length) l.appendChild(el('div', 'empty sm', 'No saved services yet. Add a custom item and tick “Save to my services”.'));
    else if (!list.length) l.appendChild(el('div', 'empty sm', 'No match.'));
    list.slice(0, 80).forEach(s => l.appendChild(card(`<div class="row"><div class="grow"><div class="ttl">${esc(s.name)}</div>

        <div class="amt">${money(s.price)}${s.unit ? `<div class="meta r">/${esc(s.unit)}</div>` : ''}</div></div>`, () => {
          closeSheet();

          DIRTY = true; lineSheet(EDIT.lines.length - 1, true);

function lineSheet(i, isNew) {
  const l = EDIT.lines[i]; if (!l) return;
  const b = el('div');
  if (l.heading) {
    b.innerHTML = field('Section heading', `<input id="lnm" value="${esc(l.name)}" placeholder="Phase 1 — Demo">`);
  } else {
    b.innerHTML = field('Item', `<input id="lnm" value="${esc(l.name)}" placeholder="Carport install">`) +
      field('Description', `<textarea id="lds" rows="3" placeholder="What's included">${esc(l.desc || '')}</textarea>`) +
      `<div class="grid3">` +
      field('Qty', `<input id="lqt" type="number" inputmode="decimal" step="any" value="${l.qty}">`) +
      field('Unit', `<input id="lun" value="${esc(l.unit || '')}" placeholder="ea, hr, sq ft">`) +
      field('Rate $', `<input id="lrt" type="number" inputmode="decimal" step="0.01" value="${l.rate || ''}" placeholder="0.00">`) +
      `</div>
      <label class="check"><input id="ltx" type="checkbox" ${l.taxable ? 'checked' : ''}> Taxable</label>
      ${!l.service ? `<label class="check"><input id="lsv" type="checkbox"> Save to my services for next time</label>` : ''}
      <div class="trow big" style="margin-top:8px"><span>Line total</span><span id="lam">${money(r2(l.qty * l.rate))}</span></div>`;
  }
  const acts = el('div', 'actions');
  acts.appendChild(btn(isNew ? 'Add' : 'Done', () => {
    l.name = $('#lnm').value.trim();
    if (!l.heading) {
      l.desc = $('#lds').value.trim(); l.qty = Number($('#lqt').value) || 0; l.unit = $('#lun').value.trim();
      l.rate = r2($('#lrt').value); l.taxable = $('#ltx').checked;
      if (!l.name && !l.desc) return toast('Give the item a name.', true);
      const sv = $('#lsv');
      if (sv && sv.checked && l.name) {
        const s = { id: uid(), business: EDIT.business || BIZ, name: l.name, description: l.desc, unit: l.unit, price: l.rate, taxable: l.taxable };
        biz().services.push(s); l.service = s.id; saveLocal();
        enqueue('saveService', s, s.name);
      }
    } else if (!l.name) return toast('Type a heading.', true);
    DIRTY = true; closeSheet(); render();
  }));
  const g = el('div', 'grid3');
  g.appendChild(btn('↑ Up', () => { if (i > 0) { EDIT.lines.splice(i - 1, 0, EDIT.lines.splice(i, 1)[0]); DIRTY = true; closeSheet(); render(); } }, 'ghost sm'));
  g.appendChild(btn('↓ Down', () => { if (i < EDIT.lines.length - 1) { EDIT.lines.splice(i + 1, 0, EDIT.lines.splice(i, 1)[0]); DIRTY = true; closeSheet(); render(); } }, 'ghost sm'));
  g.appendChild(btn('Remove', () => { EDIT.lines.splice(i, 1); DIRTY = true; closeSheet(); render(); }, 'ghost sm dangertext'));
  acts.appendChild(g);
  b.appendChild(acts);
  // Cancel on a brand-new blank line removes it
  openSheet(l.heading ? 'Heading' : (isNew ? 'New item' : 'Edit item'), b);
  const upd = () => { const a = $('#lam'); if (a) a.textContent = money(r2((Number($('#lqt').value) || 0) * (Number($('#lrt').value) || 0))); };
  ['#lqt', '#lrt'].forEach(s => { const x = $(s); if (x) x.oninput = upd; });
  if (isNew) {
    $('#scrim').onclick = () => { const x = EDIT.lines[i]; if (x && !x.name && !x.desc) EDIT.lines.splice(i, 1); closeSheet(); $('#scrim').onclick = closeSheet; render(); };
    setTimeout(() => { const n = $(l.name ? '#lqt' : '#lnm'); if (n) n.focus(); }, 250);
  }
}

/* ---- payments ---- */
function localPaid(invId) {
  const d = docById(invId); if (!d) return;
  d.paid = r2(paymentsOf(invId).reduce((s, p) => s + p.amount, 0));
  const t = totals(d).total;
  if (d.status !== 'Void') d.status = d.paid > 0 && d.paid >= t ? 'Paid' : d.paid > 0 ? 'Partial' : (['Paid', 'Partial'].includes(d.status) ? 'Sent' : d.status);
  if (EDIT && EDIT.id === invId) { EDIT.paid = d.paid; EDIT.status = d.status; }
}
function paymentSheet() {
  if (DIRTY || EDIT._new) saveEdit(true);
  const bal = balance(EDIT);
  const b = el('div');
  b.innerHTML = `<div class="grid2">` + field('Amount $', `<input id="pam" type="number" inputmode="decimal" step="0.01" value="${bal > 0 ? bal : ''}">`) +
    field('Date', `<input id="pdt" type="date" value="${today()}">`) + `</div>` +

    field('Note', `<input id="pno" placeholder="Check #, reference…">`) +
    (banksOf().length ? field('Deposited to', `<select id="pbk">${bankOptions(defaultBank(), 'Not deposited yet / cash on hand')}</select>`) : '');
  b.appendChild(btn('Save payment', () => {
    const p = { id: uid(), invoice: EDIT.id, amount: r2($('#pam').value), date: $('#pdt').value || today(), method: $('#pme').value, note: $('#pno').value.trim(), bank: $('#pbk') ? $('#pbk').value : '' };
    if (p.amount <= 0) return toast('Enter the amount paid.', true);

    enqueue('addPayment', p, 'Payment');
    closeSheet(); toast('Payment recorded'); render();
  }));
  openSheet('Record payment', b);
}

/* ---- estimate → invoice, change orders ---- */
function buildInvoice(est, cos) {
  const inv = newDoc('invoice', est.customer, est.id);
  inv.title = est.title; inv.site = est.site; inv.taxRate = est.taxRate;
  let lines = [];
  if (cos.length && est.billed) { /* change orders only */ }
  else {
    if (cos.length) lines.push({ heading: true, name: est.title || ('Estimate ' + est.number) });
    lines = lines.concat(clone(est.lines)); inv.discount = est.discount || 0;
  }
  cos.forEach(c => {
    lines.push({ heading: true, name: 'Change order ' + c.number + (c.title ? ' — ' + c.title : '') });
    lines = lines.concat(clone(c.lines));
    inv.discount = r2(inv.discount + (c.discount || 0));
  });
  inv.lines = lines;
  inv._billFrom = (est.billed ? [] : [est.id]).concat(cos.map(c => c.id));
  return inv;
}
function convertToInvoice() {
  if (DIRTY || EDIT._new) saveEdit(true);
  const est = docById(EDIT.id);
  const cos = changeOrdersOf(est.id).filter(c => c.status === 'Approved' && !c.billed);
  const inv = buildInvoice(est, cos);
  EDIT = inv; DIRTY = true; saveEdit(true);
  ROUTES.pop(); go('doc', inv.id);
  toast('Invoice created from ' + est.number + (cos.length ? ' + ' + cos.length + ' change order' + (cos.length > 1 ? 's' : '') : ''));
}
function billChangeOrder() {
  if (DIRTY) saveEdit(true);
  const co = docById(EDIT.id), est = docById(co.parent);
  const inv = buildInvoice(est, [co]);
  EDIT = inv; DIRTY = true; saveEdit(true);
  ROUTES.pop(); go('doc', inv.id);
  toast('Invoice created for ' + co.number);
}
function newChangeOrder() {
  if (DIRTY) saveEdit(true);
  const est = EDIT;
  openNewDoc('change', est.customer, est.id);
}
function duplicateDoc() {
  if (DIRTY) saveEdit(true);
  const src = EDIT;
  const d = newDoc(src.type === 'change' ? 'estimate' : src.type, src.customer);
  Object.assign(d, { title: src.title, site: src.site, lines: clone(src.lines), taxRate: src.taxRate, discount: src.discount, deposit: src.deposit, notes: src.notes, terms: src.terms });
  EDIT = d; DIRTY = true; ROUTES.pop(); go('doc', d.id);
  toast('Copy made. Change what you need and save.');
}

function actionsSheet() {
  const d = EDIT, b = el('div'), acts = el('div', 'actions');
  const A = (label, fn, cls) => acts.appendChild(btn(label, () => { closeSheet(); fn(); }, cls || 'ghost'));
  if (d.type === 'estimate' || d.type === 'change') {
    if (d.status !== 'Sent' && d.status !== 'Approved') A('Mark as sent', () => setStatus('Sent'));
    if (d.status !== 'Approved') A('Mark approved', () => setStatus('Approved'), '');
    if (d.status !== 'Declined') A('Mark declined', () => setStatus('Declined'));
  }
  if (d.type === 'estimate') {
    if (d.billed) A('Open invoice ' + ((docById(d.billed) || {}).number || ''), () => openDocFromDoc(d.billed));
    else A('Convert to invoice', convertToInvoice, '');
    if (d.status === 'Approved') A('New change order', newChangeOrder);
  }
  if (d.type === 'change') {
    const est = docById(d.parent);
    if (est) A('Open estimate ' + est.number, () => openDocFromDoc(est.id));
    if (d.billed) A('Open invoice ' + ((docById(d.billed) || {}).number || ''), () => openDocFromDoc(d.billed));
    else if (d.status === 'Approved' && est && est.billed) A('Bill this on a new invoice', billChangeOrder, '');
    else if (d.status === 'Approved' && est) acts.appendChild(el('div', 'meta', 'Approved change orders are added automatically when you convert ' + est.number + ' to an invoice.'));
  }
  if (d.type === 'invoice') {
    if (d.status !== 'Void') A('Record payment', paymentSheet, '');
    if (d.status === 'Draft') A('Mark as sent', () => setStatus('Sent'));
    if (d.status === 'Void') A('Un-void', () => setStatus('Sent'));
    else if (d.status !== 'Paid') A('Void invoice', () => setStatus('Void'));
    if (d.parent && docById(d.parent)) A('Open estimate ' + docById(d.parent).number, () => openDocFromDoc(d.parent));
  }
  if (d.type !== 'change') A('Duplicate', duplicateDoc);
  A('Delete', () => confirmSheet('Delete ' + (docLabel(d) || 'this') + '?',
    d.type === 'estimate' ? 'Its change orders are deleted too. This can’t be undone from the app.' : 'This can’t be undone from the app.', 'Delete', () => {
      if (!d._new) {
        DATA.biz.docs = biz().docs.filter(x => x.id !== d.id && !(d.type === 'estimate' && x.parent === d.id && x.type === 'change'));
        biz().docs.forEach(x => { if (x.billed === d.id) x.billed = ''; });
        saveLocal(); enqueue('deleteDoc', { id: d.id }, docLabel(d));
      }
      DIRTY = false; ROUTES.pop(); render();
    }, true), 'ghost dangertext');
  b.appendChild(acts);
  openSheet(docLabel(d) || TYPE_LABEL[d.type], b);
}

].map(([code, name, type]) => ({ code, name, type }));
const accounts = () => (biz().accounts && biz().accounts.length) ? biz().accounts : DEFAULT_ACCOUNTS;
const acctOf = name => accounts().find(a => a.name === name) || { code: '', name: name || 'Uncategorized', type: 'expense' };
const acctLabel = name => { const a = acctOf(name); return (a.code ? a.code + ' · ' : '') + a.name; };
const PAY_METHODS = ['Card', 'Cash', 'Check', 'Zelle', 'Bank transfer', 'Other'];

/* ---- periods ---- */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function periodRange(p) {
  const t = new Date(), Y = t.getFullYear(), M = t.getMonth();
  if (p === 'month') return [ymd(new Date(Y, M, 1)), ymd(new Date(Y, M + 1, 0))];
  if (p === 'last') return [ymd(new Date(Y, M - 1, 1)), ymd(new Date(Y, M, 0))];
  if (p === 'quarter') { const q = Math.floor(M / 3) * 3; return [ymd(new Date(Y, q, 1)), ymd(new Date(Y, q + 3, 0))]; }
  if (p === 'year') return [Y + '-01-01', Y + '-12-31'];
  if (p === 'lastyear') return [(Y - 1) + '-01-01', (Y - 1) + '-12-31'];
  return ['0000-00-00', '9999-12-31'];
}
const inRange = (date, r) => !!date && date >= r[0] && date <= r[1];
const PERIOD_LABEL = { month: 'This month', last: 'Last month', quarter: 'This quarter', year: 'This year', lastyear: 'Last year', all: 'All time' };
const sum = xs => r2(xs.reduce((s, x) => s + (Number(x.amount) || 0), 0));
const booked = x => x.status !== 'Review';

/* Expenses hang off a project (job). A job is an estimate, or an invoice that didn't come from one. */
function jobKeyOf(d) {
  if (!d) return '';
  if (d.type === 'change') return d.parent;
  if (d.type === 'invoice' && d.parent && docById(d.parent)) return d.parent;
  return d.id;
}
function jobOptions() {
  return docsOf('estimate').filter(d => d.status !== 'Declined')
    .concat(docsOf('invoice').filter(i => !(i.parent && docById(i.parent))))
    .sort(byNewest);
}
function jobLabel(id) {
  const d = docById(id); if (!d) return '';
  return [d.number || 'New', d.title || custName(d.customer)].filter(Boolean).join(' · ');
}
function jobExpenses(d) {
  const key = jobKeyOf(d);
  return expensesAll().filter(x => booked(x) && x.job && (x.job === key || x.job === d.id));
}
const vendorKey = v => String(v || '').toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]/g, '').slice(0, 14);
/* Last account this vendor was booked to, so the second Home Depot receipt books itself. */
function suggestAccount(vendor) {
  const k = vendorKey(vendor); if (!k) return '';
  const hit = expenses().filter(x => booked(x) && x.account && vendorKey(x.vendor) === k)
    .sort((a, b) => (b.created || '').localeCompare(a.created || ''))[0];
  return hit ? hit.account : '';
}
/* Same rule as the server: same photo, or same vendor + amount within 3 days. */
function localDuplicates(x, hash) {
  const vk = vendorKey(x.vendor), amt = r2(x.amount), t = x.date ? new Date(x.date).getTime() : NaN;
  return expenses().filter(e => e.id !== x.id).map(e => {
    if (hash && e.hash === hash) return { e, reason: 'Same photo' };
    if (amt > 0 && Math.abs(r2(e.amount) - amt) < 0.005) {
      const ev = vendorKey(e.vendor), et = new Date(e.date).getTime();
      if ((!vk || !ev || ev === vk) && (isNaN(t) || isNaN(et) || Math.abs(et - t) <= 3 * 864e5)) return { e, reason: 'Same vendor, amount and date' };
    }
    return null;
  }).filter(Boolean);
}
async function fileHash(file) {
  try {
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 40);
  } catch (e) { return ''; }
}

      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || '').localeCompare(a.created || ''));

function expenseCard(x) {
  const flags = (x.status === 'Review' ? '<span class="pill warn">Review</span>' : '') + (x.dupOf ? '<span class="pill bad">Possible duplicate</span>' : '');
  return card(`<div class="row"><div class="grow"><div class="ttl">${esc(x.vendor || 'Unknown vendor')}${x.receipt ? ' <span class="clip" title="Receipt saved">📎</span>' : ''}</div>
    <div class="meta">${esc([x.account ? acctLabel(x.account) : 'No account', jobLabel(x.job), x.checkNo ? 'Check #' + x.checkNo : x.method, !x.bank && x.paidBy ? 'paid by ' + x.paidBy : ''].filter(Boolean).join(' · '))}</div>
    ${x.status === 'Review' ? `<div class="meta">${esc(fmtDate(x.date))}</div>` : ''}
    ${x.note ? `<div class="meta clamp">${esc(x.note)}</div>` : ''}</div><div class="rcol"><div class="amt ${x.amount < 0 ? 'pos' : ''}">${x.amount ? money(x.amount) : '—'}</div>${flags}</div></div>`, () => expenseSheet(x));
}

function shrinkImage(file, max, q) {
  max = max || 1600; q = q || 0.72;
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const d = c.toDataURL('image/jpeg', q); URL.revokeObjectURL(url);
      res({ data: d.split(',')[1], type: 'image/jpeg', preview: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that photo.')); };
    img.src = url;
  });
}
